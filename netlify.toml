[build]
  publish = "."
  command = ""

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Player pages gather PSAL's public box scores into a profile per named player,
# and most of those players are minors. robots.txt keeps crawlers out; this
# header and a meta tag in the page cover anything that ignores it.
[[headers]]
  for = "/player/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Clean URLs: /school/beacon, /game/502544 and friends are app routes, not files.
# Netlify serves a real file when one exists (so /data/*.json and the icons still
# win), and falls through to the app for everything else.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Link previews: rewrite <title> and add Open Graph tags for the routes that
# name something specific. Everything else falls through untouched.
[[edge_functions]]
  function = "unfurl"
  path = "/player/*"

[[edge_functions]]
  function = "unfurl"
  path = "/school/*"
