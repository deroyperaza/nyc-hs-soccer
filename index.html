      (S.histState === "error" ? "History unavailable." : "Loading history…") + '</div></div>';
    html += '<div class="statrow">' +
      '<div class="stat"><div class="k">Record</div><div class="v">' + (rec ? rec[1] + "-" + rec[2] + (rec[3] ? "-" + rec[3] : "") : w + "-" + l + (tie ? "-" + tie : "")) + '</div></div>' +
      '<div class="stat"><div class="k">Goals for</div><div class="v">' + gf + '</div></div>' +
      '<div class="stat"><div class="k">Goals against</div><div class="v">' + ga + '</div></div></div>';
    if(played.length){
      var withScore = played.filter(hasScore);
      var withStats = withScore.filter(function(g){ return boxRowsFor(g, code) > 0; });
      var cover = withScore.length ?
        '<span class="eyebrow" style="color:' + (withStats.length === withScore.length ? "var(--muted)" : "var(--orange)") + '">stats ' +
          withStats.length + '/' + withScore.length + '</span>' : "";
      html += '<div><div class="grouphead"><h3>Results</h3><div class="rule"></div>' + cover + '</div><div class="card">' +
        played.map(function(g){ return resLine(g, code); }).join("") + '</div></div>';
      if(withScore.length && withStats.length < withScore.length){
        html += '<div style="font-size:12.5px;color:var(--muted);padding:0 2px">' +
          (withScore.length - withStats.length) + ' of ' + withScore.length +
          ' games have no player stats filed for this school on PSAL.</div>';
      }
    }
    html += statsHTML(sp, code);
    if(upcoming.length){
      html += '<div><div class="grouphead"><h3>Upcoming</h3><div class="rule"></div></div>' +
        '<div class="card"><div class="games">' + upcoming.map(function(g){ return gameHTML(g, {date:true}); }).join("") + '</div></div></div>';
    }
    if(!played.length && !upcoming.length) html += '<div class="card"><div class="empty">No games on the schedule.</div></div>';
    el("sheet-body").innerHTML = html;
    paintTeamNumbers(S.seasonId, sp, code);
    el("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    syncUrl("push");
    drawChart();
    if(S.histState !== "ok") needHistory(function(){ if(S.openTeamKey === key) openTeam(key); });
  }
  function resLine(g, code){
    var r = resultFor(g, code);
    var opp = teamOf(g[0], g[4] === code ? g[5] : g[4]);
    var home = g[4] === code;
    var right = r ? (r.ff ? r.gf : (r.gf + "–" + r.ga)) : "<span style='color:var(--muted);font-weight:600;font-size:12px'>No score posted</span>";
    var sub = fmtDate(g[2]) + " · " + (home ? "Home" : "Away") + (locOf(g) ? " · " + locOf(g) : "");
    if(hasScore(g) && !boxRowsFor(g, code)) sub = fmtDate(g[2]) + " · " + (home ? "Home" : "Away") + " · no stats filed";
    if(g[10] === 1) sub = fmtDate(g[2]) + " · " + ((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim();
    return '<button class="resline' + (S.favs.has(opp.sp + ":" + opp.code) ? " pin" : "") + '" data-game="' + esc(gkey(g)) + '">' +
      '<span class="wl ' + (r ? r.wl : "") + '">' + (r ? r.wl : "·") + '</span>' +
      '<span class="op"><span class="nm">' + esc(opp.short) + '</span><span class="dt">' + esc(sub) + '</span></span>' +
      '<span class="rs">' + right + '</span></button>';
  }
  function closeSheet(){
    el("sheet").hidden = true; S.openTeamKey = null;
    if(el("gsheet").hidden) document.body.style.overflow = "";
    syncUrl("push");
  }

  /* ---------- game sheet ---------- */
  function openGame(key){
    var g = null, ps = S.season;
    for(var i=0;i<ps.raw.G.length;i++){ if(gkey(ps.raw.G[i]) === key){ g = ps.raw.G[i]; break; } }
    if(!g) return;
    S.openGameKey = key;
    var h = teamOf(g[0], g[4]), a = teamOf(g[0], g[5]);
    var d = detailOf(g), st = status(g);
    var gp = dparts(g[2]);
    el("gsheet-name").textContent = new Date(gp.y, gp.m-1, gp.d)
      .toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
    var subBits = [];
    if(g[3]) subBits.push(fmtTime(g[3]));
    if(g[10] === 1) subBits.push(((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim());
    else if(h.div) subBits.push(divShort(h.div));
    subBits.push(seasonMeta(S.seasonId).label || S.seasonId);
    el("gsheet-sub").textContent = subBits.join(" · ");

    var html = "";
    /* score line */
    var hs = g[6], as = g[7], ff = (hs === 999 || as === 999);
    var decided = hasScore(g) && !ff && hs !== as;
    var dimH = decided && hs < as ? ";color:var(--muted)" : "";
    var dimA = decided && as < hs ? ";color:var(--muted)" : "";
    var scoreTxt = hasScore(g) ? (ff ? "Forfeit" : hs + " – " + as) : "—";
    var stChip = st === "final" ? '<span class="chip final">Final</span>' :
                 st === "ppd" ? '<span class="chip ppd">Postponed</span>' :
                 st === "ff" ? '<span class="chip ff">Forfeit</span>' :
                 st === "sus" ? '<span class="chip ppd">Suspended</span>' :
                 '<span class="chip time">' + esc(fmtTime(g[3]) || "Scheduled") + '</span>';
    html += '<div class="boxwrap"><div class="kv" style="padding:14px 13px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
      '<div style="min-width:0"><button data-gteam="' + esc(g[0] + ":" + g[4]) + '" style="text-align:left;display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:16px' +
        dimH + '">' + esc(h.name) +
        ' <span style="font-size:11px;color:var(--muted)">HOME</span> <span style="color:var(--blue);font-size:12px">&rsaquo;</span></button>' +
      '<button data-gteam="' + esc(g[0] + ":" + g[5]) + '" style="text-align:left;display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;margin-top:4px' +
        dimA + '">' + esc(a.name) +
        ' <span style="font-size:11px;color:var(--muted)">AWAY</span> <span style="color:var(--blue);font-size:12px">&rsaquo;</span></button></div>' +
      '<div style="text-align:right;flex:none"><div style="font-family:Archivo,sans-serif;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums">' +
        esc(scoreTxt) + '</div><div style="margin-top:4px">' + stChip + '</div></div></div></div></div>';

    /* halves */
    if(d && (d[2].length || d[3].length)){
      var ph = d[2], pa = d[3];
      var cols = Math.max(ph.length, pa.length);
      var names = ["1st", "2nd", "3rd", "4th", "OT", "OT2", "OT3"];
      var used = [];
      for(var c=0;c<cols;c++){
        if((ph[c] || 0) !== 0 || (pa[c] || 0) !== 0 || c < 2) used.push(c);
      }
      if(used.length){
        html += '<div class="boxwrap"><div class="boxhead"><h3>By half</h3></div>' +
          '<table class="halftbl"><thead><tr><th></th>' +
          used.map(function(c){ return '<th>' + names[c] + '</th>'; }).join("") + '<th>F</th></tr></thead><tbody>' +
          [[h, ph, hs], [a, pa, as]].map(function(row){
            return '<tr><td>' + esc(row[0].short) + '</td>' +
              used.map(function(c){ var v = row[1][c]; return '<td>' + (v == null ? (hasScore(g) ? 0 : "–") : v) + '</td>'; }).join("") +
              '<td class="tot">' + (row[2] == null ? "–" : (row[2] === 999 ? "W" : row[2])) + '</td></tr>';
          }).join("") + '</tbody></table></div>';
      }
    }

    /* box score */
    if(d && d[4] && d[4].length){
      var P = ps.raw.P;
      var rows = d[4].map(function(b){
        return {code:b[0], name:P[b[1]] || "", g:b[2], a:b[3], sv:b[4], sh:b[5], ga:b[6]};
      });
      S.gshown = {};
      [[h, g[4]], [a, g[5]]].forEach(function(side){
        var team = side[0], code = side[1];
        var mine = rows.filter(function(r){ return r.code === code; });
        var named = S.gshown[code] = {};
        if(!mine.length){
          html += '<div class="boxwrap"><button class="boxhead" data-gteam="' + esc(g[0] + ":" + code) + '" style="width:100%">' +
            '<h3>' + esc(team.short) + ' <span style="color:var(--blue)">&rsaquo;</span></h3>' +
            '<span class="sub">no player stats posted</span></button>' +
            '<div class="empty" style="padding:14px 13px;text-align:left">PSAL has no box score entries for ' +
            esc(team.short) + ' in this game — the other side\'s coach filed stats and theirs didn\'t.</div>' +
            rosterFold(g[0], code, false) + '</div>';
          return;
        }
        mine.forEach(function(r){
          if(r.g || r.a || r.sv || r.ga || r.sh) named[r.name] = 1;
        });
        var scorers = mine.filter(function(r){ return r.g || r.a; })
          .sort(function(x, y){ return (y.g - x.g) || (y.a - x.a) || x.name.localeCompare(y.name); });
        var keepers = mine.filter(function(r){ return r.sv || r.ga; })
          .sort(function(x, y){ return y.sv - x.sv; });
        var shooters = mine.filter(function(r){ return r.sh && !r.g && !r.a; })
          .sort(function(x, y){ return y.sh - x.sh; });
        var tot = mine.reduce(function(acc, r){ return acc + r.g; }, 0);
        html += '<div class="boxwrap"><button class="boxhead" data-gteam="' + esc(g[0] + ":" + code) + '" style="width:100%">' +
          '<h3>' + esc(team.short) + ' <span style="color:var(--blue)">&rsaquo;</span></h3>' +
          '<span class="sub">' + (tot ? tot + " goal" + (tot === 1 ? "" : "s") + " recorded" : "no scorers posted") + '</span></button>';
        if(scorers.length){
          html += '<div class="plist">' + scorers.map(function(r){
            var bits = [];
            if(r.g) bits.push('<em>G</em> ' + r.g);
            if(r.a) bits.push('<em>A</em> ' + r.a);
            if(r.sh) bits.push('<em>SH</em> ' + r.sh);
            return '<div class="prow"><span class="pn">' + numSlot(code, r.name) +
              plink(g[0], code, r.name) + grSlot(code, r.name) +
              posSlot(code, r.name) + '</span>' +
              '<span class="pv">' + bits.join(" &nbsp; ") + '</span></div>';
          }).join("") + '</div>';
        }
        if(keepers.length){
          html += '<div class="plist" style="border-top:1px solid var(--line-soft)">' + keepers.map(function(r){
            var bits = [];
            if(r.sv) bits.push('<em>SV</em> ' + r.sv);
            if(r.ga) bits.push('<em>GA</em> ' + r.ga);
            return '<div class="prow"><span class="pn">' + numSlot(code, r.name) +
              plink(g[0], code, r.name) + grSlot(code, r.name) +
              posSlot(code, r.name, "GK") + '</span>' +
              '<span class="pv">' + bits.join(" &nbsp; ") + '</span></div>';
          }).join("") + '</div>';
        }
        if(shooters.length){
          html += '<div class="plist" style="border-top:1px solid var(--line-soft)">' + shooters.map(function(r){
            return '<div class="prow"><span class="pn">' + numSlot(code, r.name) +
              plink(g[0], code, r.name) + grSlot(code, r.name) +
              posSlot(code, r.name) + '</span>' +
              '<span class="pv"><em>SH</em> ' + r.sh + '</span></div>';
          }).join("") + '</div>';
        }
        html += rosterFold(g[0], code, Object.keys(named).length > 0) + '</div>';
      });
    } else if(hasScore(g)){
      html += '<div class="card"><div class="empty">PSAL didn\'t post a box score for this game.</div></div>';
    }

    /* details */
    var det = [];
    det.push(["Date", fmtDateLong(g[2]) + (g[3] ? " · " + fmtTime(g[3]) : "")]);
    if(locOf(g)) det.push(["Venue", locOf(g)]);
    if(d && d[0] >= 0 && ps.raw.AD[d[0]]) det.push(["Address", ps.raw.AD[d[0]].replace(/,\s*$/, "").replace(/,/g, ", ")]);
    if(h.div) det.push(["Division", divLabel(h.div) + (a.div && a.div !== h.div ? " / " + divLabel(a.div) : "")]);
    if(g[10] === 1) det.push(["Round", ((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim()]);
    else if(g[10] === 2) det.push(["Type", "Non-league game"]);
    if(reasonOf(g)) det.push(["Status", titleCase(reasonOf(g))]);
    if(d && d[1] && d[1].length) det.push([d[1].length > 1 ? "Referees" : "Referee", d[1].map(function(i){ return ps.raw.R[i]; }).filter(Boolean).join(", ")]);
    if(d && d[5] >= 0 && ps.raw.R[d[5]]) det.push(["Trainer", ps.raw.R[d[5]]]);
    html += '<div class="boxwrap"><div class="boxhead"><h3>Game details</h3></div><div class="kv">' +
      det.map(function(r){ return '<div class="r"><span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + '</span></div>'; }).join("") +
      '</div></div>';

    el("gsheet-body").innerHTML = html;
    paintNumbers(S.seasonId, key);
    el("gsheet").hidden = false;
    document.body.style.overflow = "hidden";
    syncUrl("push");
  }
  // A box-score row knows a name and a school but not a cid, so the number
  // cannot be drawn with it. Each row leaves a slot instead, and paintNumbers
  // fills them in when the season's roster and profile files land.
  // A box-score row knows a name and a school but not a cid, so neither mark
  // can be drawn with it. The empty number chip goes in straight away, so the
  // row does not shift when the roster lands and the values drop in.
  function numSlot(code, name){
    return '<span class="jnslot" data-jn="' + esc(code + "\u0001" + name) + '">' +
      jersey("") + '</span>';
  }
  function grSlot(code, name){
    return '<span class="grslot" data-gr="' + esc(code + "\u0001" + name) + '"></span>';
  }
  // The keepers list already knows what it is looking at, so it passes GK as a
  // fallback: PSAL leaves the position blank for two players in three, and a
  // goalkeeper losing his label to a missing field would be a step backwards.
  function posSlot(code, name, fb){
    return '<span class="posslot" data-ps="' + esc(code + "\u0001" + name) + '">' +
      (fb ? ' <span class="pos">' + esc(fb) + '</span>' : "") + '</span>';
  }
  function paintNumbers(sid, gk){
    var root = el("gsheet-body");
    if(!root || !root.querySelector(".jnslot[data-jn]")) return;
    needRoster(sid, function(r){
      if(!r || r === "error" || !r.R || !r.R[gk]) return;
      needUni(sid, function(u){
        if(!u) return;
        var byName = {};
        r.R[gk].forEach(function(x){
          byName[x[0] + "\u0001" + (r.P[x[1]] || "")] = x[2];
        });
        fillSlots(root, byName, u);
      });
    });
  }

  // The three names at the top of a school page come from the season payload,
  // which has no cid, so their shirts are filled the same way a box score's
  // are: from the roster file, matched on name within this school.
  function paintTeamNumbers(sid, sp, code){
    var root = el("sheet-body");
    if(!root || !root.querySelector(".jnslot[data-jn]")) return;
    needRoster(sid, function(r){
      if(!r || r === "error" || !r.R) return;
      needUni(sid, function(u){
        if(!u) return;
        var byName = {};
        Object.keys(r.R).forEach(function(gk){
          if(+gk.split(":")[0] !== sp) return;
          r.R[gk].forEach(function(x){
            if(x[0] === code) byName[x[0] + "\u0001" + (r.P[x[1]] || "")] = x[2];
          });
        });
        fillSlots(root, byName, u);
      });
    });
  }

  // "Defender/Midfielder" is longer than most of the names it sits next to, and
  // in a roster row the name is the part that matters. The build already folds
  // PSAL's free text down to four positions, so they abbreviate cleanly.
  var POS_ABBR = {Goalkeeper: "GK", Defender: "D", Midfielder: "M", Forward: "F"};
  function posShort(p){
    if(!p) return "";
    return String(p).split("/").map(function(x){ return POS_ABBR[x] || x; }).join("/");
  }

  function fillSlots(root, byName, u){
    Array.prototype.forEach.call(root.querySelectorAll(".jnslot[data-jn]"), function(n){
      var rec = u[String(byName[n.getAttribute("data-jn")])];
      if(rec && rec[0]) n.innerHTML = jersey(rec[0]);
      n.removeAttribute("data-jn");
    });
    Array.prototype.forEach.call(root.querySelectorAll(".grslot[data-gr]"), function(n){
      var rec = u[String(byName[n.getAttribute("data-gr")])];
      if(rec && rec[1]) n.innerHTML = gradeChip(rec[1]);
      n.removeAttribute("data-gr");
    });
    Array.prototype.forEach.call(root.querySelectorAll(".posslot[data-ps]"), function(n){
      var rec = u[String(byName[n.getAttribute("data-ps")])];
      if(rec && rec[2]) n.innerHTML = ' <span class="pos">' + esc(posShort(rec[2])) + '</span>';
      n.removeAttribute("data-ps");
    });
  }

  // The leaders table spans every school in a season, so its name-to-cid map
  // is built over the whole sport rather than one game or one team. Same three
  // slots, same roster file, wider net.
  function paintLeaders(sid, sp){
    var root = el("view-history");
    if(!root || !root.querySelector(".jnslot[data-jn]")) return;
    needRoster(sid, function(r){
      if(!r || r === "error" || !r.R) return;
      needUni(sid, function(u){
        if(!u) return;
        var byName = {};
        Object.keys(r.R).forEach(function(gk){
          if(+gk.split(":")[0] !== sp) return;
          r.R[gk].forEach(function(x){
            byName[x[0] + "\u0001" + (r.P[x[1]] || "")] = x[2];
          });
        });
        fillSlots(root, byName, u);
      });
    });
  }

  function rosterFold(sp, code, hadStats){
    return '<button class="rosterbtn" data-roster="' + esc(sp + ":" + code) + '">' +
      '<span>' + (hadStats ? "Rest of the roster" : "Full roster") +
      '</span><span class="ch">Show \u203a</span></button>' +
      '<div id="roster-' + sp + '-' + code + '" hidden></div>';
  }
  // Jersey silhouette with the number on the chest. Two digits get a smaller
  // face so they sit inside the torso rather than over the seams.
  // Jersey silhouette with the number on the chest. The baseline is computed
  // rather than centred by attribute, because dominant-baseline is the kind of
  // thing that renders one way in a test and another on someone's phone.
  var JERSEY_PATH =
    "M8.8 3 L3.6 4.9 C2.8 5.2 2.4 6 2.6 6.8 L3.6 10.8 C3.8 11.5 4.5 11.9 5.2 11.8 " +
    "L6.4 11.4 L6.4 21.4 C6.4 22 6.9 22.4 7.5 22.4 L16.5 22.4 " +
    "C17.1 22.4 17.6 22 17.6 21.4 L17.6 11.4 L18.8 11.8 " +
    "C19.5 11.9 20.2 11.5 20.4 10.8 L21.4 6.8 C21.6 6 21.2 5.2 20.4 4.9 L15.2 3 " +
    "C14.8 4.8 13.5 6 12 6 C10.5 6 9.2 4.8 8.8 3 Z";
  // A shirt with no number is still a shirt: PSAL has no number for about a
  // quarter of players, and an empty placeholder keeps the rows aligned and
  // says "not recorded" rather than leaving a hole.
  //
  // Two digits are forced to a fixed width rather than trusted to fit, because
  // the fallback font is not the one this was measured against and "1" and "8"
  // are not the same width in any of them. The baseline is computed from the
  // font size: dominant-baseline renders one way in a test and another on a
  // phone.
  var GRADES = {"09": "FR", "9": "FR", "10": "SO", "11": "JR", "12": "SR"};
  function gradeChip(g){
    var t = GRADES[String(g == null ? "" : g).trim()];
    return t ? '<span class="grchip">' + t + '</span>' : "";
  }
  function jersey(num, big){
    var n = String(num == null ? "" : num).trim().slice(0, 3);
    if(!big){
      return '<span class="numchip' + (n ? "" : " none") + '"' +
        (n ? ' aria-label="Shirt number ' + esc(n) + '"' : ' aria-hidden="true"') +
        '>' + esc(n || "\u00a0") + '</span>';
    }
    var body = "";
    if(n){
      var size = n.length > 2 ? 6.6 : n.length > 1 ? 8.4 : 9.6;
      var fit = n.length > 1
        ? ' textLength="' + (n.length > 2 ? 9.6 : 8.8) + '" lengthAdjust="spacingAndGlyphs"'
        : "";
      body = '<text x="12" y="' + (15.1 + 0.355 * size).toFixed(2) + '" ' +
        'text-anchor="middle" style="font-size:' + size + 'px"' + fit + '>' +
        esc(n) + '</text>';
    }
    return '<span class="jersey" role="img" aria-label="' +
      (n ? "Shirt number " + esc(n) : "No shirt number on file") + '">' +
      '<svg viewBox="0 0 24 24"><path d="' + JERSEY_PATH + '"></path>' +
      body + '</svg></span>';
  }

  window.__jersey = jersey;   // for visual checks in a test harness

  function titleCase(s){
    s = String(s || "");
    if(s !== s.toUpperCase()) return s;
    return s.toLowerCase().replace(/(^|[\s\-'])([a-z])/g, function(m, a, b){ return a + b.toUpperCase(); });
  }
  function closeGame(){
    el("gsheet").hidden = true; S.openGameKey = null;
    if(el("sheet").hidden) document.body.style.overflow = "";
    syncUrl("push");
  }

  /* ---------- player sheet ---------- */
  function setRobots(){
    var m = el("robotsmeta");
    if(m) m.setAttribute("content", S.openPlayer ? "noindex,nofollow" : "index,follow");
  }
  function openPlayer(key){
    S.openPlayer = key;
    setRobots();
    el("psheet").hidden = false;
    document.body.style.overflow = "hidden";
    S.pdata = null;
    document.title = routeTitle();
    el("psheet-name").textContent = "Loading\u2026";
    el("psheet-sub").textContent = "";
    el("psheet-body").innerHTML = '<div class="card"><div class="empty">Looking up this player\u2026</div></div>';
    syncUrl("push");
    needShard(key, function(bundle){
      if(S.openPlayer !== key) return;
      var p = bundle && bundle[key], live = liveRows(key);
      if(p && p.ref){
        // this spelling was merged into another career; follow it and fix the URL
        S.openPlayer = p.ref;
        needShard(p.ref, function(b2){
          if(S.openPlayer !== p.ref) return;
          S.pdata = null;
          var p2 = b2 && b2[p.ref];
          if(p2) renderPlayer(p.ref, p2, liveRows(p.ref));
          syncUrl("now");
        });
        return;
      }
      if(!p && !live){
        el("psheet-name").textContent = "Player not found";
        el("psheet-sub").textContent = "";
        el("psheet-body").innerHTML = '<div class="card"><div class="empty">' +
          'No PSAL record under that name and school. A player only appears here ' +
          'once a coach has filed a sheet with them on it.</div></div>';
        return;
      }
      S.pdata = null;
      renderPlayer(key, p, live);
    });
  }
  function hidePlayer(){
    el("psheet").hidden = true; S.openPlayer = null; setRobots();
  }
  function closePlayer(){
    el("psheet").hidden = true; S.openPlayer = null;
    setRobots();
    if(el("sheet").hidden && el("gsheet").hidden) document.body.style.overflow = "";
    syncUrl("push");
  }
  /* The career shards stop at last season -- the app stitches the current one
     in itself, so an hourly refresh never rewrites a shard. That is also why
     the number went missing here: a player whose only season is this one has
     no shard at all, and a player who has one carries his number inside it
     only for the seasons the shard covers. The players page showed a number
     and his own page showed an empty shirt.

     The name index is the one file that knows the current number for both
     kinds of player, and it is a couple of KB, so the page asks it for
     whatever the payload could not supply. */
  function fillLiveNumber(key){
    var root = el("psheet-body"), badge = el("psheet-num"), hdr = el("psheet-name");
    var blanks = root ? root.querySelectorAll('.pjn[data-y="' + META.defaultSeason + '"]') : [];
    var needNum = badge && !badge.querySelector("text");
    var needGr = hdr && !hdr.querySelector(".grchip");
    if(!blanks.length && !needNum && !needGr) return;
    var parts = key.split("/"), sp = +parts[0], slug = parts[1] || "";
    var first = slug.split("-")[0];
    if(first.length < 2) return;
    needNames(first, function(rows){
      if(S.openPlayer !== key) return;
      var row = null;
      for(var i = 0; i < rows.length; i++){
        if(rows[i][1] === slug && rows[i][2] === sp){ row = rows[i]; break; }
      }
      if(!row) return;
      var u = row[6] || "", g = row[7] || "";
      if(u){
        Array.prototype.forEach.call(blanks, function(n){
          if(n.querySelector(".numchip.none")) n.innerHTML = jersey(u);
        });
        if(needNum) badge.innerHTML = jersey(u, true);
      }
      if(g && needGr) hdr.innerHTML = hdr.innerHTML + " " + gradeChip(g);
    });
  }

  function renderPlayer(key, p, live){
    var sp = +key.split("/")[0];
    // seasons as [yearInt, rows]; the live season is stitched on rather than
    // shipped, so it is always as fresh as the scores page
    var blocks = (p && p.s ? p.s.slice() : []);
    if(live) blocks.push([live.y, live.rows]);
    blocks.sort(function(x, z){ return z[0] - x[0]; });

    var name = (p && p.n) || (live && live.who.n) || "";
    var code = (p && p.sc) || (live && live.who.sc) || "";
    var full = (p && p.fn) || (S.season && S.season !== "error" &&
      (S.season.teams[sp + ":" + code] || {}).name) || SHORTS[code] || code;

    // PSAL files a jersey number and a grade against each season a player
    // registered for. Neither is in the box-score feed; both ride along in the
    // career payload, which is why they survive for the live season too.
    var M = (p && p.m) || {};
    // The newest season is not always the one with a number on it -- a school
    // that filed numbers one year may not have the next -- so the badge shows
    // the most recent one PSAL actually recorded.
    var newest = null;
    for(var bi = 0; bi < blocks.length && !newest; bi++){
      var cand = M[String(blocks[bi][0])];
      if(cand && cand.u) newest = cand;
    }
    el("psheet-name").innerHTML = esc(titleCase(name)) +
      (newest && newest.g ? " " + gradeChip(newest.g) : "");
    var badge = el("psheet-num");
    if(badge){
      badge.innerHTML = jersey(newest && newest.u, true);
      badge.hidden = false;
    }
    var years = blocks.map(function(bl){ return (seasonMeta(String(bl[0])) || {}).label || bl[0]; });
    var span = years.length === 1 ? years[0]
      : years[years.length-1] + "\u2013" + String(years[0]).replace(/^\D+/, "");
    el("psheet-sub").textContent = full + " \u00b7 " + (sp === 1 ? "Girls" : "Boys") +
      " Varsity \u00b7 " + span;

    var tot = {ap:0, g:0, a:0, sh:0, sv:0, ga:0};
    blocks.forEach(function(bl){
      bl[1].forEach(function(r){
        tot.ap++; tot.g += r[7]; tot.a += r[8]; tot.sv += r[9]; tot.sh += r[10]; tot.ga += r[11];
      });
    });
    var keeper = tot.sv > 0 || tot.ga > 0;
    function cell(v, k){ return '<div><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

    var html = '<div class="boxwrap"><button class="boxhead" data-gteam="' +
      esc(sp + ":" + code) + '" style="width:100%"><h3>' + esc(SHORTS[code] || full) +
      ' <span style="color:var(--blue)">&rsaquo;</span></h3>' +
      '<span class="sub">' + tot.ap + " appearance" + (tot.ap === 1 ? "" : "s") +
      " across " + blocks.length + " season" + (blocks.length === 1 ? "" : "s") + '</span></button>' +
      '<div class="careerbar">' + cell(tot.ap, "Games") + cell(tot.g, "Goals") +
      cell(tot.a, "Assists") +
      (keeper ? cell(tot.sv, "Saves") : cell(tot.sh, "Shots")) + '</div></div>';

    blocks.forEach(function(bl){
      var y = bl[0], rows = bl[1].slice().sort(function(x, z){ return x[1] - z[1]; });
      var sg = 0, sa = 0, ssv = 0;
      rows.forEach(function(r){ sg += r[7]; sa += r[8]; ssv += r[9]; });
      var bits = [rows.length + " game" + (rows.length === 1 ? "" : "s")];
      if(sg) bits.push(sg + " G");
      if(sa) bits.push(sa + " A");
      if(ssv) bits.push(ssv + " SV");
      var m = M[String(y)] || {};
      var who = [];
      if(m.sn) who.push(m.sn);            // the season they were somewhere else
      if(m.g && GRADE[m.g]) who.push(GRADE[m.g]);
      if(m.p) who.push(m.p);
      html += '<div class="boxwrap"><div class="boxhead"><h3>' +
        esc((seasonMeta(String(y)) || {}).label || y) +
        ' <span class="pjn" data-y="' + y + '">' + jersey(m.u) +
          '</span></h3>' +
        '<span class="sub">' + esc(who.concat(bits).join(" \u00b7 ")) + '</span></div>' +
        '<table class="glog"><thead><tr><th>Date</th><th style="text-align:left">Opponent</th>' +
        '<th>Result</th>' + (keeper ? '<th>SV</th><th>GA</th>' : '<th>G</th><th>A</th><th>SH</th>') +
        '</tr></thead><tbody>' +
        rows.map(function(r){
          var dp = dparts(r[1]);
          var gf = r[4], ga = r[5];
          var wl = (gf == null || ga == null) ? "" : gf > ga ? "W" : gf < ga ? "L" : "T";
          var res = (gf == null || ga == null) ? "\u2013"
            : (gf === 999 || ga === 999) ? "FF" : (gf + "\u2013" + ga);
          var num = function(v){ return v ? v : '<span class="zero">0</span>'; };
          return '<tr><td>' + dp.m + "/" + dp.d + '</td>' +
            '<td style="text-align:left"><button class="plink op" data-pgame="' +
              esc(y + ":" + sp + ":" + r[0]) + '">' + (r[3] ? "" : "@ ") +
              esc(SHORTS[r[2]] || r[2]) +
              (r[6] ? ' <span style="color:var(--muted);font-size:11px">PO</span>' : "") +
            '</button></td>' +
            '<td><span class="wl ' + wl + '">' + wl + '</span> ' + res + '</td>' +
            (keeper ? '<td>' + num(r[9]) + '</td><td>' + num(r[11]) + '</td>'
                    : '<td>' + num(r[7]) + '</td><td>' + num(r[8]) + '</td><td>' + num(r[10]) + '</td>') +
            '</tr>';
        }).join("") + '</tbody></table></div>';
    });

    // Transfers are merged now, so what is left here is the other case: two
    // people PSAL files separately who happen to share a name and a school,
    // and therefore an address. Each one links to the other.
    var also = (p && p.also) || [];
    if(also.length){
      html += '<div class="boxwrap"><div class="boxhead"><h3>Someone else by this name</h3>' +
        '<span class="sub">PSAL files these as a different player</span></div>' +
        also.map(function(o){
          return '<button class="alsorow" data-player="' + esc(sp + "/" + o[0]) + '">' +
            esc(titleCase(name)) + ' at ' + esc(SHORTS[o[1]] || o[1]) +
            ' <span style="color:var(--blue)">&rsaquo;</span>' +
            '<span class="q">' + esc(o[2] === o[3] ? seasonLabel(o[2])
              : seasonLabel(o[2]) + "\u2013" + String(seasonLabel(o[3])).replace(/^\D+/, "")) +
            '</span></button>';
        }).join("") + '</div>';
    }

    html += '<div class="boxwrap"><div class="pnote">' +
      'PSAL issues a new player id every season, but its own player profiles ' +
      'link them, so a career here is PSAL\u2019s grouping rather than a guess at ' +
      'a name. A player who changed schools has one page, under the school they ' +
      'finished at. Numbers, grades and positions come from those profiles: a ' +
      'grade is recorded for everyone, a number for about three players in four. ' +
      'Appearances count games where a coach filed a sheet.' +
      '</div></div>';
    el("psheet-body").innerHTML = html;
    fillLiveNumber(key);
    el("psheet-body").scrollTop = 0;
    var yy = blocks.map(function(bl){ return bl[0]; });
    S.pdata = {n: name, sc: code, u: (newest && newest.u) || "",
               g: (newest && newest.g) || "",
               y0: Math.min.apply(null, yy), y1: Math.max.apply(null, yy)};
    document.title = routeTitle();   // the name only arrives with the shard
    syncPStar();
  }

  /* ---------- full roster on a school page ----------
     Same file and the same idea as the box-score fold, but rolled up over the
     whole season instead of one game: a player's rows are summed across every
     fixture, so someone who dressed eleven times and never troubled the sheet
     still appears, which is the point of showing a roster at all. */
  function toggleSchoolRoster(arg){
    var parts = arg.split(":"), sp = +parts[0], code = parts[1];
    var box = el("sroster-" + sp + "-" + code);
    var btn = document.querySelector('[data-sroster="' + arg + '"] .ch');
    if(!box) return;
    if(!box.hidden){ box.hidden = true; if(btn) btn.textContent = "Show \u203a"; return; }
    box.hidden = false;
    if(btn) btn.textContent = "Hide";
    if(box.dataset.done) return;
    box.innerHTML = '<div class="pnote">Loading the roster\u2026</div>';
    var sid = S.seasonId, keyNow = S.openTeamKey;
    needRoster(sid, function(r){
      if(S.openTeamKey !== keyNow) return;
      if(r === "error" || !r || !r.R){
        box.innerHTML = '<div class="pnote">PSAL has no rosters on file for this season.</div>';
        box.dataset.done = "1";
        return;
      }
      var by = {}, order = [];
      Object.keys(r.R).forEach(function(gk){
        if(+gk.split(":")[0] !== sp) return;
        r.R[gk].forEach(function(x){
          if(x[0] !== code) return;
          var e = by[x[2]];
          if(!e){
            e = by[x[2]] = {cid: x[2], n: r.P[x[1]] || "", gp: 0,
                            g: 0, a: 0, sv: 0, sh: 0, ga: 0};
            order.push(e);
          }
          e.gp++; e.g += x[3]; e.a += x[4]; e.sv += x[5]; e.sh += x[6]; e.ga += x[7];
        });
      });
      var already = S.tshown || {};
      var mine = order.filter(function(e){ return e.n && !already[e.n]; });
      if(!mine.length){
        box.innerHTML = '<div class="pnote">' +
          (Object.keys(already).length
            ? "Everyone PSAL has on file for this school is already listed above."
            : "PSAL has no roster on file for this school.") + '</div>';
        box.dataset.done = "1";
        return;
      }
      mine.sort(function(x, z){
        var sx = x.g * 3 + x.a * 2 + x.sh + x.sv, sz = z.g * 3 + z.a * 2 + z.sh + z.sv;
        if(sx !== sz) return sz - sx;
        return x.n.localeCompare(z.n);
      });
      needUni(sid, function(u){
        box.innerHTML = '<div class="plist">' + mine.map(function(e){
          var bits = [];
          if(e.g) bits.push('<em>G</em> ' + e.g);
          if(e.a) bits.push('<em>A</em> ' + e.a);
          if(e.sv) bits.push('<em>SV</em> ' + e.sv);
          if(e.sh) bits.push('<em>SH</em> ' + e.sh);
          if(e.ga) bits.push('<em>GA</em> ' + e.ga);
          var quiet = !bits.length;
          var rec = (u && u[String(e.cid)]) || ["", "", ""];
          return '<div class="prow' + (quiet ? " dnp" : "") + '">' +
            '<span class="pn">' + jersey(rec[0]) + " " +
              plink(sp, code, e.n) + gradeChip(rec[1]) +
              (rec[2] ? ' <span class="pos">' + esc(posShort(rec[2])) + '</span>' : "") + '</span>' +
            '<span class="pv">' + (quiet ? "\u2014 " + e.gp + " game" + (e.gp === 1 ? "" : "s")
                                         : bits.join(" &nbsp; ")) + '</span></div>';
        }).join("") + '</div>';
        box.dataset.done = "1";
      });
    });
  }

  /* ---------- full roster, folded under each side of a box score ----------
     The rosters live in their own per-season file: everyone who dressed, not
     just whoever put a number on the sheet. It is fetched the first time
     someone asks for one, so the app's own payload doesn't carry it. */
  function toggleRoster(arg){
    var parts = arg.split(":"), sp = +parts[0], code = parts[1];
    var box = el("roster-" + sp + "-" + code);
    var btn = document.querySelector('[data-roster="' + arg + '"] .ch');
    if(!box) return;
    if(!box.hidden){ box.hidden = true; if(btn) btn.textContent = "Show \u203a"; return; }
    box.hidden = false;
    if(btn) btn.textContent = "Hide";
    if(box.dataset.done) return;
    box.innerHTML = '<div class="pnote">Loading the roster\u2026</div>';
    var sid = S.seasonId, gkeyNow = S.openGameKey;
    needRoster(sid, function(r){
      if(S.openGameKey !== gkeyNow) return;
      if(r === "error" || !r || !r.R || !r.R[gkeyNow]){
        box.innerHTML = '<div class="pnote">PSAL has no roster on file for this game.</div>';
        box.dataset.done = "1";
        return;
      }
      // whoever the box score already named is not repeated here -- the fold
      // exists to show the players a stat line leaves out
      var already = (S.gshown && S.gshown[code]) || {};
      var mine = r.R[gkeyNow].filter(function(x){
        return x[0] === code && !already[r.P[x[1]] || ""];
      });
      if(!mine.length){
        box.innerHTML = '<div class="pnote">' +
          (Object.keys(already).length
            ? "Everyone PSAL has on the sheet for this side is already listed above."
            : "PSAL has no roster on file for this side.") + '</div>';
        box.dataset.done = "1";
        return;
      }
      mine.sort(function(x, z){
        var sx = x[3] + x[4] + x[5] + x[6], sz = z[3] + z[4] + z[5] + z[6];
        if(sx !== sz) return sz - sx;
        return String(r.P[x[1]] || "").localeCompare(String(r.P[z[1]] || ""));
      });
      // The roster rows carry a cid, so here the number and position can be
      // drawn straight in rather than patched in afterwards.
      needUni(sid, function(u){
        box.innerHTML = '<div class="plist">' + mine.map(function(x){
          var name = r.P[x[1]] || "", bits = [];
          if(x[3]) bits.push('<em>G</em> ' + x[3]);
          if(x[4]) bits.push('<em>A</em> ' + x[4]);
          if(x[5]) bits.push('<em>SV</em> ' + x[5]);
          if(x[6]) bits.push('<em>SH</em> ' + x[6]);
          if(x[7]) bits.push('<em>GA</em> ' + x[7]);
          var quiet = !bits.length;
          var rec = (u && u[String(x[2])]) || ["", "", ""];
          return '<div class="prow' + (quiet ? " dnp" : "") + '">' +
            '<span class="pn">' + jersey(rec[0]) + " " + plink(sp, code, name) +
            gradeChip(rec[1]) +
            (rec[2] ? ' <span class="pos">' + esc(posShort(rec[2])) + '</span>' : "") + '</span>' +
            '<span class="pv">' + (quiet ? "\u2014" : bits.join(" &nbsp; ")) + '</span></div>';
        }).join("") + '</div>';
        box.dataset.done = "1";
      });
    });
  }

  /* ---------- players ----------
     Search only: you type a name and the app fetches the one index file for
     that prefix. There is deliberately no file that lists every player and no
     way to page through them -- these are mostly minors, and the site should
     not be a way to enumerate them. Followed players are kept in this browser
     and sit at the top. */
  var STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"></path></svg>';

  /* ---------- moving follows between devices ----------
     No accounts and no server, so the list travels in a link: teams in ?f=
     (which already existed for the iOS tile) and players in ?p=. Opening it
     merges rather than replaces, and the parameters are stripped straight
     afterwards so they don't sit in the address bar or reach analytics. */
  function syncLink(){
    var base = location.origin + "/players" + (S.sp === 1 ? "/girls" : "/boys");
    var q = [];
    var teams = Array.from(S.favs);
    if(teams.length) q.push("f=" + encodeURIComponent(teams.join(",")));
    if(S.pfavOrder.length) q.push("p=" + encodeURIComponent(S.pfavOrder.join(" ")));
    return base + (q.length ? "?" + q.join("&") : "");
  }
  function mergeSyncFromUrl(){
    var m = location.search.match(/[?&]p=([^&]*)/);
    if(!m) return false;
    var got = 0;
    try{
      decodeURIComponent(m[1]).split(/[ ,]+/).forEach(function(k){
        if(!k || S.pfavs[k]) return;
        S.pfavs[k] = [k, "", "", 0, 0];   // the real name arrives with the shard
        S.pfavOrder.push(k);
        got++;
      });
    }catch(e){}
    if(got) savePFavs();
    // drop ?p= from the address bar straight away rather than waiting for the
    // router's first write, so the names aren't sitting in the URL when the
    // analytics beacon reads it
    try{
      var clean = location.pathname + location.search.replace(/([?&])p=[^&]*/, "$1")
        .replace(/[?&]$/, "").replace(/\?&/, "?");
      history.replaceState(null, "", clean + location.hash);
    }catch(e){}
    return got > 0;
  }
  /* A synced follow arrives as a bare key and has to find its own name.
     Three places to look, cheapest first: this season's payload, which the page
     already holds; the archive shard; and failing both, the name index, which is
     the only one that carries a player who has only ever played this season. */
  function fillFav(k, name, code, y0, y1, uni, grade){
    if(!name) return false;
    S.pfavs[k] = [k, name, code || "", y0 || 0, y1 || 0, uni || "", grade || ""];
    savePFavs();
    if(S.view === "players") renderPlayers();
    return true;
  }
  /* The slug is <name words>-<school slug>, and the school slugs are all known,
     so a name can be recovered from it when every lookup has failed. */
  function schoolSlugIn(slug){
    var best = "";
    Object.keys(SLUGS).forEach(function(code){
      var sl = SLUGS[code];
      if(sl && sl.length > best.length && slug.length > sl.length &&
         slug.slice(-(sl.length + 1)) === "-" + sl) best = sl;
    });
    return best;
  }
  function codeFromSlug(slug){
    var sl = schoolSlugIn(slug), out = "";
    Object.keys(SLUGS).forEach(function(code){ if(SLUGS[code] === sl) out = code; });
    return out;
  }
  function nameFromSlug(slug){
    var sl = schoolSlugIn(slug);
    var words = (sl ? slug.slice(0, -(sl.length + 1)) : slug).split("-");
    return words.join(" ").toUpperCase();
  }
  /* A follow saved before jersey numbers existed has a name but no number, and
     the career shard is a 90KB fetch to answer a two-character question. The
     name index carries the number now and is a couple of KB, so ask that.

     Only a hit is written back. Writing the miss too looked like a sensible
     way to stop the lookup repeating, and it cached "no number" permanently
     for anyone who opened the page during the eleven minutes between the
     shirts shipping and the index being rebuilt with numbers in it. Nothing
     would ever have asked again. hydrateFavs runs at boot, not per render, so
     there was never a repeat to prevent. */
  function uniFromIndex(k){
    var parts = k.split("/"), sp = +parts[0], slug = parts[1] || "";
    var first = slug.split("-")[0];
    if(first.length < 2) return;
    needNames(first, function(rows){
      var e = S.pfavs[k];
      if(!e) return;
      for(var i = 0; i < rows.length; i++){
        if(rows[i][1] === slug && rows[i][2] === sp){
          var u = rows[i][6] || "", g = rows[i][7] || "";
          if(!u && !g) return;
          if(u) e[5] = u;
          if(g) e[6] = g;
          savePFavs();
          if(S.view === "players") renderPlayers();
          return;
        }
      }
    });
  }
  function hydrateFavs(){
    S.pfavOrder.forEach(function(k){
      var e = S.pfavs[k];
      if(e && e[1] && (e[5] === undefined || e[6] === undefined)) uniFromIndex(k);
      if(!e || e[1]) return;
      var live = liveRows(k);
      if(live && live.who && fillFav(k, live.who.n, live.who.sc, live.y, live.y)){
        uniFromIndex(k);      // liveRows knows the name, not the shirt
        return;
      }
      needShard(k, function(bundle){
        var p = bundle && bundle[k];
        var use = function(key, q){
          var yy = (q.s || []).map(function(b){ return b[0]; });
          var u = "", g = "";
          Object.keys(q.m || {}).sort().forEach(function(y){
            if(q.m[y].u) u = q.m[y].u;      // ascending, so the last one wins
            if(q.m[y].g) g = q.m[y].g;
          });
          fillFav(key, q.n, q.sc,
                  yy.length ? Math.min.apply(null, yy) : 0,
                  yy.length ? Math.max.apply(null, yy) : 0, u, g);
        };
        if(p && p.ref){
          // a merged spelling: the real career sits in a different shard, so
          // follow it and move the follow onto the canonical key
          var ref = p.ref;
          needShard(ref, function(b2){
            var q = b2 && b2[ref];
            if(!q || !q.n) return;
            if(S.pfavs[ref]){
              delete S.pfavs[k];
              S.pfavOrder = S.pfavOrder.filter(function(x){ return x !== k; });
              savePFavs();
              if(S.view === "players") renderPlayers();
              return;
            }
            S.pfavOrder = S.pfavOrder.map(function(x){ return x === k ? ref : x; });
            delete S.pfavs[k];
            use(ref, q);
          });
          return;
        }
        if(p && p.n){ use(k, p); return; }
        var parts = k.split("/"), sp = +parts[0], slug = parts[1] || "";
        var first = slug.split("-")[0];
        if(first.length < 2) return;
        needNames(first, function(rows){
          for(var i = 0; i < rows.length; i++){
            if(rows[i][1] === slug && rows[i][2] === sp){
              fillFav(k, rows[i][0], rows[i][3], rows[i][4], rows[i][5],
                      rows[i][6], rows[i][7]);
              return;
            }
          }
          fillFav(k, nameFromSlug(slug), codeFromSlug(slug), 0, 0);
        });
      });
    });
  }
  function loadPFavs(){
    try{
      var raw = JSON.parse(localStorage.getItem("psal.pfavs") || "[]");
      raw.forEach(function(e){
        // An empty string here is a miss an older build wrote down. Drop it so
        // the number gets looked up again; a real absence costs one small
        // index fetch a session and shows an empty shirt either way.
        if(e && e[5] === "" && e[6] === undefined) e.length = 5;
        if(e && e[0] && !S.pfavs[e[0]]){ S.pfavs[e[0]] = e; S.pfavOrder.push(e[0]); }
      });
    }catch(e){}
  }
  function savePFavs(){
    // the stored array IS the order, so dragging persists for free
    try{
      localStorage.setItem("psal.pfavs", JSON.stringify(S.pfavOrder.map(function(k){
        return S.pfavs[k];
      }).filter(Boolean)));
    }catch(e){}
  }
  function togglePFav(key, name, code, y0, y1, uni, grade){
    if(S.pfavs[key]){
      delete S.pfavs[key];
      S.pfavOrder = S.pfavOrder.filter(function(k){ return k !== key; });
    }else{
      S.pfavs[key] = [key, name, code, y0 || 0, y1 || 0, uni || "", grade || ""];
      S.pfavOrder.push(key);
    }
    savePFavs();
    if(S.view === "players") renderPlayers();
    if(S.openPlayer) syncPStar();
  }
  function syncPStar(){
    var b = el("psheet-fav");
    if(b) b.setAttribute("aria-pressed", S.pfavs[S.openPlayer] ? "true" : "false");
  }

  function prefixFor(tok){
    if(tok.length < 3) return tok;
    var three = tok.slice(0, 3);
    var deep = (META.deep || []);
    if(tok.length >= 4 && deep.indexOf(three) >= 0) return tok.slice(0, 4);
    return three;
  }
  function needNames(tok, after){
    var pre = prefixFor(tok);
    if(S.ncache[pre]){ after(S.ncache[pre]); return; }
    fetch(META.path + "n/" + encodeURIComponent(pre) + ".json")
      .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
      .then(function(o){ S.ncache[pre] = o; after(o); })
      .catch(function(){ S.ncache[pre] = []; after([]); });
  }

  function playerRowHTML(key, name, code, y0, y1, extra, grip, uni, grade){
    var fav = !!S.pfavs[key];
    var yrs = y0 && y1 ? (y0 === y1 ? seasonLabel(y0) : seasonLabel(y0) + "\u2013" + String(seasonLabel(y1)).replace(/^\D+/, "")) : "";
    var meta_ = [SHORTS[code] || code, yrs].filter(Boolean).join(" \u00b7 ");
    if(!name){ name = "Loading\u2026"; meta_ = ""; }
    return '<div class="presult' + (fav ? " isfav" : "") + '" data-key="' + esc(key) + '">' +
      (grip ? '<span class="grip" data-grip aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
        '<path d="M5 9h14M5 15h14"></path></svg></span>' : '') +
      '<button class="who" data-player="' + esc(key) + '">' +
        '<span class="nm">' + jersey(uni) + esc(titleCase(name)) +
          gradeChip(grade) + '</span>' +
        '<span class="mt">' + esc(meta_ + (extra || "")) + '</span>' +
      '</button>' +
      '<button class="star" aria-pressed="' + fav + '" aria-label="Follow this player" ' +
        'data-pfav="' + esc(key) + '" data-pn="' + esc(name) + '" data-pc="' + esc(code) +
        '" data-py0="' + (y0 || 0) + '" data-py1="' + (y1 || 0) +
        '" data-pu="' + esc(uni || "") + '" data-pg="' + esc(grade || "") +
        '">' + STAR + '</button>' +
      '</div>';
  }
  function seasonLabel(y){
    var m = seasonMeta(String(y));
    return (m && m.label) || String(y);
  }

  function renderPlayers(){
    var v = el("view-players");
    var years = [["all", "All time"]].concat((META.seasons || []).map(function(sm){
      return [sm.id, sm.label];
    }));
    var head = '<div class="psearch">' +
      '<input id="pq" type="search" autocomplete="off" autocorrect="off" spellcheck="false" ' +
        'placeholder="Search a player by name" value="' + esc(S.pq) + '" aria-label="Search players">' +
      '<select id="pyear" aria-label="Limit to a season">' +
        years.map(function(y){
          return '<option value="' + esc(y[0]) + '"' + (S.pyear === y[0] ? " selected" : "") +
            '>' + esc(y[1]) + '</option>';
        }).join("") +
      '</select></div>';

    var favKeys = S.pfavOrder.filter(function(k){ return S.pfavs[k]; });
    var body = "";
    if(favKeys.length){
      body += '<div class="card"><div class="boxhead"><h3>Following</h3>' +
        '<span class="sub">' + favKeys.length + ' player' +
        (favKeys.length === 1 ? "" : "s") +
        (favKeys.length > 1 ? " \u00b7 drag to reorder" : "") + '</span></div>' +
        '<div id="favlist">' + favKeys.map(function(k){
          var e = S.pfavs[k];
          return playerRowHTML(k, e[1], e[2], e[3], e[4], "",
                               favKeys.length > 1, e[5], e[6]);
        }).join("") + '</div></div>';
    }

    var q = S.pq.trim();
    if(q.length < 3){
      body += '<div class="card"><div class="empty" style="text-align:left;padding:16px 13px">' +
        (favKeys.length ? "Type at least three letters to find another player."
                        : "Type at least three letters of a player's name. " +
                          "Tap the star to follow someone and they'll stay at the top of this page.") +
        '</div></div>' + syncHTML();
      v.innerHTML = head + body;
      initFavDrag();          // this branch renders the followed list too
      wireSync();
      return;
    }

    var res = S.presults;
    if(res === "loading"){
      body += '<div class="card"><div class="loading">Searching\u2026</div></div>';
    } else if(!res || !res.length){
      body += '<div class="card"><div class="empty">No player by that name' +
        (S.pyear === "all" ? "" : " in " + esc((seasonMeta(S.pyear) || {}).label || S.pyear)) + '.</div></div>';
    } else {
      var shown = res.slice(0, 60);
      body += '<div class="card"><div class="boxhead"><h3>Results</h3><span class="sub">' +
        (res.length > 60 ? "first 60 of " + res.length : res.length + " found") + '</span></div>' +
        shown.map(function(e){
          return playerRowHTML(e[2] + "/" + e[1], e[0], e[3], e[4], e[5],
                               "", false, e[6], e[7]);
        }).join("") + '</div>';
      if(res.length > 60){
        body += '<div class="card"><div class="pnote">Add another letter to narrow this down.</div></div>';
      }
    }
    v.innerHTML = head + body + syncHTML();
    initFavDrag();
    wireSync();
  }

  /* Drag to reorder the followed list. Pointer events rather than HTML5
     drag-and-drop, because that one does not exist on touch. The grip carries
     touch-action:none so a drag isn't taken over by page scrolling. */
  function initFavDrag(){
    var list = el("favlist");
    if(!list || list.dataset.wired) return;
    list.dataset.wired = "1";
    var d = null;
    list.addEventListener("pointerdown", function(e){
      var h = e.target.closest ? e.target.closest("[data-grip]") : null;
      if(!h) return;
      var row = h.closest(".presult");
      if(!row) return;
      e.preventDefault();
      var rows = Array.prototype.slice.call(list.querySelectorAll(".presult"));
      var i = rows.indexOf(row);
      d = {row: row, rows: rows, from: i, to: i, y0: e.clientY,
           h: row.getBoundingClientRect().height};
      row.classList.add("dragging");
      try{ h.setPointerCapture(e.pointerId); }catch(x){}
    });
    list.addEventListener("pointermove", function(e){
      if(!d) return;
      var dy = e.clientY - d.y0;
      d.row.style.transform = "translateY(" + dy + "px)";
      var to = d.from + Math.round(dy / d.h);
      to = Math.max(0, Math.min(d.rows.length - 1, to));
      if(to === d.to) return;
      d.to = to;
      d.rows.forEach(function(r, i){
        if(r === d.row) return;
        var shift = 0;
        if(d.from < to && i > d.from && i <= to) shift = -d.h;
        else if(d.from > to && i >= to && i < d.from) shift = d.h;
        r.style.transform = shift ? "translateY(" + shift + "px)" : "";
      });
    });
    var drop = function(){
      if(!d) return;
      var f = d; d = null;
      f.rows.forEach(function(r){ r.style.transform = ""; });
      f.row.classList.remove("dragging");
      if(f.to !== f.from){
        var order = S.pfavOrder.slice();
        order.splice(f.to, 0, order.splice(f.from, 1)[0]);
        S.pfavOrder = order;
        savePFavs();
      }
      renderPlayers();
    };
    list.addEventListener("pointerup", drop);
    list.addEventListener("pointercancel", drop);
  }

  function syncHTML(){
    var have = S.pfavOrder.length || S.favs.size;
    if(!S.syncOpen){
      return '<div class="card"><button class="rosterbtn" id="syncbtn">' +
        '<span>Move follows between devices</span>' +
        '<span class="ch">Show \u203a</span></button></div>';
    }
    var url = syncLink();
    return '<div class="card"><button class="rosterbtn" id="syncbtn">' +
      '<span>Move follows between devices</span><span class="ch">Hide</span></button>' +
      '<div class="syncbox">' +
        (have ?
          '<div class="qr" id="qr"></div>' +
          '<p class="pnote" style="padding:0">Point your phone\u2019s camera at this. ' +
          'It opens the site there and adds ' + S.pfavOrder.length + ' player' +
          (S.pfavOrder.length === 1 ? "" : "s") +
          (S.favs.size ? ' and ' + S.favs.size + ' team' + (S.favs.size === 1 ? "" : "s") : "") +
          ' to whatever that device already follows.</p>' +
          '<div class="synclink"><input id="syncurl" readonly value="' + esc(url) + '">' +
          '<button id="synccopy">Copy</button></div>'
        : "") +
        '<div class="syncin"' + (have ? '' : ' style="border-top:0;padding-top:0"') + '>' +
          '<div class="pnote" style="padding:0">' + esc(standalone()
            ? "This app has its own storage, separate from Safari \u2014 a scanned code lands in Safari, not here. Paste a sync link to bring follows in."
            : "Got a sync link from another device? Paste it here.") + '</div>' +
          '<div class="synclink"><input id="syncpaste" placeholder="Paste a sync link" ' +
            'autocomplete="off" autocorrect="off" spellcheck="false">' +
          '<button id="syncadd">Add</button></div>' +
        '</div>' +
      '</div></div>';
  }
  function standalone(){
    try{
      return window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    }catch(e){ return false; }
  }
  /* Accepts a whole sync link or just the key list, so it survives being
     forwarded, shortened or half-selected. */
  function applySyncText(txt){
    txt = String(txt || "").trim();
    if(!txt) return 0;
    var got = 0, teams = null, players = null;
    var pm = txt.match(/[?&]p=([^&\s]*)/), fm = txt.match(/[?&]f=([^&\s]*)/);
    try{ if(pm) players = decodeURIComponent(pm[1]); }catch(e){}
    try{ if(fm) teams = decodeURIComponent(fm[1]); }catch(e){}
    if(!pm && !fm && txt.indexOf("/") >= 0) players = txt;
    (players || "").split(/[\s,]+/).forEach(function(k){
      if(!k || !/^[01]\//.test(k) || S.pfavs[k]) return;
      S.pfavs[k] = [k, "", "", 0, 0];
      S.pfavOrder.push(k);
      got++;
    });
    (teams || "").split(/[\s,]+/).forEach(function(k){
      if(!k || !/^[01]:/.test(k) || S.favs.has(k)) return;
      S.favs.add(k); got++;
    });
    if(got){ savePFavs(); saveFavs(); hydrateFavs(); }
    return got;
  }
  function wireSync(){
    var box = el("qr");
    if(!box || box.dataset.done) return;
    box.dataset.done = "1";
    var url = syncLink();
    // drawn locally when the library loads; the link below works regardless
    var go = function(){
      try{
        new window.QRCode(box, {text: url, width: 190, height: 190,
          correctLevel: window.QRCode.CorrectLevel.M});
      }catch(e){ box.innerHTML = '<div class="pnote" style="padding:0">' +
        'Couldn\u2019t draw the code \u2014 use the link below.</div>'; }
    };
    if(window.QRCode) return go();
    var sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload = go;
    sc.onerror = function(){
      box.innerHTML = '<div class="pnote" style="padding:0">' +
        'Couldn\u2019t load the code drawer \u2014 use the link below.</div>';
    };
    document.head.appendChild(sc);
  }

  function runSearch(){
    var q = S.pq.trim().toLowerCase();
    if(q.length < 3){ S.presults = null; renderPlayers(); return; }
    var tokens = slugName(q).split("-").filter(function(t){ return t.length; });
    if(!tokens.length){ S.presults = null; renderPlayers(); return; }
    // the longest word is the most selective, so that's the index file to pull
    var lead = tokens.slice().sort(function(a, b){ return b.length - a.length; })[0];
    if(lead.length < 3){ S.presults = null; renderPlayers(); return; }
    S.presults = "loading"; renderPlayers();
    var want = q;
    needNames(lead, function(rows){
      if(S.pq.trim().toLowerCase() !== want) return;
      var yr = S.pyear === "all" ? null : +S.pyear;
      var out = rows.filter(function(e){
        if(e[2] !== S.sp) return false;
        if(yr && !(e[4] <= yr && yr <= e[5])) return false;
        var hay = slugName(e[0]);
        return tokens.every(function(t){
          return hay.split("-").some(function(w){ return w.indexOf(t) === 0; });
        });
      });
      out.sort(function(a, b){
        return (b[5] - a[5]) || String(a[0]).localeCompare(String(b[0]));
      });
      S.presults = out;
      renderPlayers();
    });
  }

  document.addEventListener("change", function(e){
    if(!e.target || e.target.id !== "pyear") return;
    S.pyear = e.target.value;
    runSearch();
  });
  document.addEventListener("input", function(e){
    if(!e.target || e.target.id !== "pq") return;
    S.pq = e.target.value;
    if(S.pqTimer) clearTimeout(S.pqTimer);
    S.pqTimer = setTimeout(function(){
      var box = el("pq"), at = box ? box.selectionStart : null;
      runSearch();
      var again = el("pq");
      if(again){ again.focus(); if(at != null){ try{ again.setSelectionRange(at, at); }catch(x){} } }
    }, 250);
  });

  /* ---------- shell ---------- */
  function render(){
    S.favDivs = favDivs();
    ["scores","standings","teams","playoffs","players","history"].forEach(function(v){
      el("view-" + v).hidden = v !== S.view;
      el("tab-" + v).setAttribute("aria-pressed", v === S.view ? "true" : "false");
    });
    el("sport-0").setAttribute("aria-pressed", S.sp === 0 ? "true" : "false");
    el("sport-1").setAttribute("aria-pressed", S.sp === 1 ? "true" : "false");
    if(S.view === "history"){ renderHistory(); return; }
    if(S.view === "players"){ renderPlayers(); return; }
    if(!S.season || S.season === "error"){
      el("view-" + S.view).innerHTML = '<div class="card"><div class="' + (S.season === "error" ? "empty" : "loading") + '">' +
        (S.season === "error" ? "Couldn't load that season." : "Loading season…") + '</div></div>';
      return;
    }
    if(S.view === "scores") renderScores();
    else if(S.view === "standings") renderStandings();
    else if(S.view === "teams") renderTeams();
    else if(S.view === "playoffs") renderPlayoffs();
  }
  function setHeaderHeight(){
    var bar = document.querySelector(".topbar");
    if(!bar) return;
    var h = Math.round(bar.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--hdr", h + "px");
  }
  function setStamp(){
    var t = el("stamptext"), stamp = el("stamp");
    if(!isCurrent()){
      stamp.classList.remove("live");
      t.textContent = (S.season && S.season.label ? S.season.label : "") + " archive";
      return;
    }
    stamp.classList.add("live");
    var d = new Date(META.updated);
    t.textContent = isNaN(d) ? "Live" : "Updated " + d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  }
  function openSeasonMenu(){
    var list = el("seasonmenu-list");
    list.innerHTML = META.seasons.map(function(s){
      return '<button data-season="' + esc(s.id) + '" aria-pressed="' + (s.id === S.seasonId) + '">' +
        '<span>' + esc(s.label) + '</span>' + (s.cur ? '<span class="tag">Current</span>' : "") + '</button>';
    }).join("");
    el("seasonmenu").hidden = false;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("button, circle[data-pt]") : null;
    if(!b) return;
    var id = b.id || "";
    if(id.indexOf("tab-") === 0){ S.view = id.slice(4); render(); syncUrl("push"); window.scrollTo(0, 0); return; }
    if(id === "homebtn"){
      if(!el("gsheet").hidden) closeGame();
      if(!el("sheet").hidden) closeSheet();
      S.view = "scores"; S.boro = ""; S.div = ""; S.query = "";
      if(S.season && S.season !== "error") S.date = S.defaultDate = pickDate(S.season, S.sp);
      render(); syncUrl("push"); window.scrollTo(0, 0);
      return;
    }
    if(id === "sport-0" || id === "sport-1"){
      S.sp = +id.slice(-1); S.div = "";
      // search results are scoped to one sport, so flipping it re-runs them
      if(S.view === "players"){ runSearch(); }
      if(S.season && S.season !== "error"){
        S.defaultDate = pickDate(S.season, S.sp);
        var has = (S.season.byDate[S.date] || []).some(function(g){ return g[0] === S.sp; });
        if(!has) S.date = S.defaultDate;
      }
      render(); syncUrl("push"); return;
    }
    if(id === "seasonbtn"){ openSeasonMenu(); return; }
    if(id === "seasonmenu-close"){ el("seasonmenu").hidden = true; return; }
    if(id === "sheet-close"){ closeSheet(); return; }
    if(id === "gsheet-close"){ closeGame(); return; }
    if(id === "psheet-close"){ closePlayer(); return; }
    if(id === "clearf"){ S.boro = ""; S.div = ""; render(); return; }
    if(id === "sheet-fav"){ toggleFav(b.dataset.key); return; }
    if(id === "hsub-champs"){ S.hsub = "champs"; render(); syncUrl("push"); return; }
    if(id === "hsub-rank"){ S.hsub = "rank"; render(); syncUrl("push"); return; }
    if(id === "hsub-leaders"){ S.hsub = "leaders"; render(); syncUrl("push"); return; }
    if(b.dataset.lbs){ S.lbStat = b.dataset.lbs; render(); return; }
    if(b.dataset.lbt){ S.lbTier = b.dataset.lbt; render(); return; }
    if(b.dataset.lby){
      var ly = b.dataset.lby;
      if(ly !== S.seasonId) loadSeason(ly, function(){ S.view = "history"; S.hsub = "leaders"; render(); });
      return;
    }
    if(b.dataset.season){
      el("seasonmenu").hidden = true;
      if(b.dataset.season !== S.seasonId) loadSeason(b.dataset.season);
      return;
    }
    if(b.dataset.date){ S.date = +b.dataset.date; render(); syncUrl("push"); return; }
    if(b.dataset.boro != null && b.hasAttribute("data-boro")){ S.boro = b.dataset.boro; S.div = ""; render(); return; }
    if(b.dataset.div != null && b.hasAttribute("data-div")){ S.div = b.dataset.div; render(); return; }
    if(b.dataset.ry){ S.rankYear = b.dataset.ry; render(); return; }
    if(b.dataset.rs){ S.rankSort = b.dataset.rs; render(); return; }
    if(b.dataset.tyr){
      var bits = b.dataset.tyr.split(":"), yid = bits[0], ykey = bits[1] + ":" + bits[2];
      if(yid === S.seasonId){ return; }
      S.openTeamKey = ykey;
      el("sheet-body").innerHTML = '<div class="card"><div class="loading">Loading ' +
        esc(seasonMeta(yid).label || yid) + '\u2026</div></div>';
      loadSeason(yid, function(){
        if(S.season && S.season !== "error" && S.season.teams[ykey]) openTeam(ykey);
        else openHistTeam(ykey);
      });
      return;
    }
    if(b.dataset.tsp){
      var tk = b.dataset.tsp;
      S.sp = +tk.split(":")[0];
      if(S.season && S.season !== "error" && S.season.teams[tk]) openTeam(tk);
      else openHistTeam(tk);
      render();
      return;
    }
    if(id === "syncbtn"){ S.syncOpen = !S.syncOpen; renderPlayers(); return; }
    if(id === "syncadd"){
      var inp = el("syncpaste");
      var n = applySyncText(inp ? inp.value : "");
      if(n){ S.syncOpen = false; renderPlayers(); }
      else if(inp){ inp.value = ""; inp.placeholder = "That didn\u2019t look like a sync link"; }
      return;
    }
    if(id === "synccopy"){
      var box = el("syncurl");
      if(box){
        box.select();
        var ok = false;
        try{ ok = document.execCommand("copy"); }catch(e){}
        if(!ok && navigator.clipboard) navigator.clipboard.writeText(box.value);
        b.textContent = "Copied";
        setTimeout(function(){ var again = el("synccopy"); if(again) again.textContent = "Copy"; }, 1600);
      }
      return;
    }
    if(b.dataset.pfav){
      togglePFav(b.dataset.pfav, b.dataset.pn, b.dataset.pc,
                 +b.dataset.py0, +b.dataset.py1, b.dataset.pu, b.dataset.pg);
      return;
    }
    if(id === "psheet-fav"){
      var pd = S.pdata || {};
      togglePFav(S.openPlayer, pd.n || "", pd.sc || "", pd.y0 || 0, pd.y1 || 0,
                 pd.u || "", pd.g || "");
      return;
    }
    if(b.dataset.player){ openPlayer(b.dataset.player); return; }
    if(b.dataset.pgame){
      // a row in a career log: load that season if it isn't the one on screen
      var pg = b.dataset.pgame.split(":"), gk = pg[1] + ":" + pg[2];
      hidePlayer();
      if(pg[0] !== S.seasonId){ loadSeason(pg[0], function(){ openGame(gk); }); }
      else openGame(gk);
      return;
    }
    if(b.dataset.roster){ toggleRoster(b.dataset.roster); return; }
    if(b.dataset.sroster){ toggleSchoolRoster(b.dataset.sroster); return; }
    if(b.dataset.gteam){ hidePlayer(); closeGame(); openTeam(b.dataset.gteam); return; }
    if(b.dataset.team){ hidePlayer(); openTeam(b.dataset.team); return; }
    if(b.dataset.hteam){ openHistTeam(b.dataset.hteam); return; }
    if(b.dataset.game){ openGame(b.dataset.game); return; }
  });
  document.addEventListener("click", function(ev){
    var c = ev.target;
    if(c && c.tagName === "circle" && c.getAttribute("data-pt") != null){
      var i = +c.getAttribute("data-pt"), p = (window.__chartPts || [])[i];
      var note = el("chartnote");
      if(p && note) note.textContent = noteFor(p);
      var svg = el("teamchart");
      if(svg) Array.prototype.forEach.call(svg.querySelectorAll(".pt"), function(el2, j){ el2.classList.toggle("sel", j === i); });
    }
  }, true);
  function openHistTeam(key){
    var code = key.split(":")[1];
    if(S.season && S.season.teams[key]){ openTeam(key); return; }
    /* team not in the loaded season: show its history card only */
    S.openTeamKey = key;
    var e = S.hist && S.hist.teams[key];
    el("sheet-name").textContent = e ? e.n : "School " + code;
    el("sheet-sub").textContent = "All seasons on record";
    el("sheet-fav").setAttribute("aria-pressed", S.favs.has(key) ? "true" : "false");
    el("sheet-fav").dataset.key = key;
    el("sheet-body").innerHTML = teamSegHTML(key) + teamYearsHTML(key) + chartHTML(key) + (e ? '<div class="card"><div class="standtbl"><table><thead><tr>' +
      '<th>Season</th><th>W</th><th>L</th><th>T</th><th>Pts</th></tr></thead><tbody>' +
      e.s.slice().sort(function(a, b){ return b[0] - a[0]; }).map(function(r){
        return '<tr><td>' + esc(seasonMeta(String(r[0])).label || r[0]) + '</td><td>' + r[1] + '</td><td>' + r[2] +
          '</td><td>' + r[3] + '</td><td class="pts">' + r[4] + '</td></tr>';
      }).join("") + '</tbody></table></div></div>' : "");
    el("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    syncUrl("push");
    drawChart();
  }
  var __rsz;
  window.addEventListener("resize", function(){
    clearTimeout(__rsz);
    __rsz = setTimeout(function(){
      setHeaderHeight();
      if(!el("sheet").hidden) drawChart();
    }, 180);
  });
  window.addEventListener("orientationchange", function(){ setTimeout(setHeaderHeight, 250); });
  document.addEventListener("toggle", function(ev){
    var t = ev.target;
    if(!t) return;
    if(t.id === "method") S.methodOpen = t.open;
    if(t.dataset && t.dataset.boroAcc) S.openBoros[t.dataset.boroAcc] = t.open;
  }, true);
  document.addEventListener("input", function(ev){
    if(ev.target && ev.target.id === "tsearch"){
      S.query = ev.target.value;
      renderTeams();
      var i = el("tsearch");
      if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    }
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape"){
      if(!el("gsheet").hidden) closeGame();
      else if(!el("sheet").hidden) closeSheet();
      else if(!el("seasonmenu").hidden) el("seasonmenu").hidden = true;
    }
  });
  el("seasonmenu").addEventListener("click", function(ev){
    if(ev.target === el("seasonmenu")) el("seasonmenu").hidden = true;
  });

  /* ---------- boot ---------- */
  /* Apply whatever the URL asks for. Called at boot and on back/forward. */
  function applyRoute(){
    var plan = parseRoute();
    S.sp = plan.sp;
    if(!el("psheet").hidden){ el("psheet").hidden = true; S.openPlayer = null; }
    if(!el("gsheet").hidden){ el("gsheet").hidden = true; S.openGameKey = null; }
    if(!el("sheet").hidden){ el("sheet").hidden = true; S.openTeamKey = null; }
    document.body.style.overflow = "";
    S.openTeamKey = null; S.openGameKey = null; S.openPlayer = null;
    setRobots();
    S.view = plan.view; if(plan.hsub) S.hsub = plan.hsub;
    el("sport-0").setAttribute("aria-pressed", S.sp === 0 ? "true" : "false");
    el("sport-1").setAttribute("aria-pressed", S.sp === 1 ? "true" : "false");

    var want = plan.season || META.defaultSeason;
    /* Bare paths (/, /standings, /school/beacon) are accepted and then rewritten
       to the canonical form, so every link that gets copied carries its sport. */
    var done = function(){ syncUrl("now"); routing = false; document.title = routeTitle(); };
    var finish = function(){
      if(plan.date && S.season && S.season !== "error" && S.season.byDate[plan.date]) S.date = plan.date;
      render();
      if(plan.team){
        var key = plan.sp + ":" + plan.team;
        if(S.season && S.season !== "error" && S.season.teams[key]){ openTeam(key); done(); }
        else needHistory(function(){ openHistTeam(key); done(); });
      } else if(plan.player){
        openPlayer(plan.sp + "/" + plan.player);
        done();
      } else if(plan.game){
        var gid = +plan.game;
        if(S.season && S.season !== "error"){
          var g = S.season.raw.G.filter(function(x){ return x[1] === gid; })[0];
          if(g) openGame(gkey(g));
        }
        done();
      } else {
        done();
      }
    };
    routing = true;
    if(want !== S.seasonId) loadSeason(want, finish); else finish();
  }

  loadFavs();
  loadPFavs();
  if(mergeSyncFromUrl()) S.view = "players";
  window.addEventListener("popstate", function(){ applyRoute(); window.scrollTo(0, 0); });
  window.addEventListener("pagehide", function(){ syncFavUrl(true); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) syncFavUrl(true); });
  setHeaderHeight();
  window.addEventListener("load", setHeaderHeight);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(setHeaderHeight);
  S.cache[BOOT.season.id] = parseSeason(BOOT.season);
  applySeason(S.cache[BOOT.season.id]);
  applyRoute();
  hydrateFavs();          // after the season payload is in memory, not before
})();
</script>
