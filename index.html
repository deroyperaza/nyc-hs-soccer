  function champsHTML(){
    var F = S.hist.finals || {};
    var years = META.seasons.map(function(m){ return m.id; })
      .filter(function(y){ return F[y]; })
      .sort(function(a, b){ return b - a; });
    var total = years.reduce(function(acc, y){ return acc + ((F[y][S.sp] || []).length); }, 0);
    var out = '<div class="sectionhead"><span class="eyebrow">City champions &amp; runners-up</span>' +
      '<span class="eyebrow">' + total + ' finals</span></div>';
    out += years.map(function(y){
      var rows = (F[y][S.sp] || []).slice();
      var head = '<div class="grouphead"><h3>' + esc(seasonMeta(y).label || y) + '</h3><div class="rule"></div></div>';
      if(!rows.length){
        return '<div class="group">' + head +
          '<div class="card"><div class="empty" style="padding:14px 13px;text-align:left">' +
          (seasonMeta(y).cur ? "Playoffs haven\'t been played yet." : "PSAL has no championship games on record for this season.") +
          '</div></div></div>';
      }
      return '<div class="group">' + head + '<div class="card">' + rows.map(function(r){
        var cls = r[0], w = r[2], wn = r[3], ws = r[4], l = r[5], ln = r[6], ls = r[7], d = r[8], alt = r[10];
        return '<div class="final">' +
          '<div class="lvl' + (alt ? " alt" : "") + '">' + esc(cls) + (alt ? '<span class="tag2">2nd</span>' : "") + '</div>' +
          '<div class="pair">' +
            '<button class="side win" data-hteam="' + esc(S.sp + ":" + w) + '">' +
              '<span class="medal gold"></span><span class="nm' + (w === PIN ? " pin" : "") + '">' + esc(wn) + '</span>' +
              '<span class="sc">' + ws + '</span></button>' +
            '<button class="side" data-hteam="' + esc(S.sp + ":" + l) + '">' +
              '<span class="medal silver"></span><span class="nm' + (l === PIN ? " pin" : "") + '">' + esc(ln) + '</span>' +
              '<span class="sc">' + ls + '</span></button>' +
          '</div>' +
          '<div class="when">' + esc(fmtDate(d)) + '</div>' +
        '</div>';
      }).join("") + '</div></div>';
    }).join("");
    out += '<div style="font-size:12px;color:var(--muted);padding:6px 2px 0">Levels are shown as PSAL named them that season: ' +
      'the top flight was <b>1A</b> (with B, and later D, beneath it) through 2024, and became <b>3A</b> from 2025. ' +
      'A few seasons ran two separate brackets at the same level; the earlier one is tagged <b>2nd</b>.</div>';
    return out;
  }
  function rankRows(){
    var T = S.hist.teams, out = [];
    Object.keys(T).forEach(function(k){
      var sp = +k.split(":")[0];
      if(sp !== S.sp) return;
      var e = T[k], w = 0, l = 0, t = 0, n = 0, titles = 0, finals = 0, rsum = 0, gsum = 0, cls = {};
      e.s.forEach(function(r){
        if(S.rankYear !== "all" && r[0] !== +S.rankYear) return;
        var g = r[1] + r[2] + r[3];
        if(!g) return;
        w += r[1]; l += r[2]; t += r[3]; n++;
        gsum += g; rsum += seasonRating(r) * g;
        if(r[5]) cls[r[5]] = (cls[r[5]] || 0) + 1;
        if((r[7] || 0) === 6) titles++;
        if((r[7] || 0) >= 5) finals++;
      });
      if(!gsum) return;
      var topCls = Object.keys(cls).sort(function(a, b){ return cls[b] - cls[a]; })[0] || "";
      out.push({key:k, name:(e.sn || e.n), w:w, l:l, t:t, n:n, cls:topCls,
                p:pct(w, l, t), r:rsum / gsum, titles:titles, finals:finals});
    });
    var maxG = 0;
    out.forEach(function(r){ maxG = Math.max(maxG, r.w + r.l + r.t); });
    var min = S.rankYear === "all" ? 40 : Math.max(1, Math.min(6, Math.floor(maxG / 2)));
    out = out.filter(function(r){ return (r.w + r.l + r.t) >= min; });
    var key = S.rankSort || "r";
    out.sort(function(a, b){
      if(key === "titles") return (b.titles - a.titles) || (b.finals - a.finals) || (b.r - a.r);
      if(key === "p") return (b.p - a.p) || (b.w - a.w);
      return (b.r - a.r) || (b.p - a.p);
    });
    return out;
  }
  function rankHTML(){
    var years = META.seasons.map(function(m){ return m.id; }).sort(function(a, b){ return b - a; });
    var chips = '<div class="filterrow"><span class="flabel">Season</span><div class="chips scroll">' +
      '<button data-ry="all" aria-pressed="' + (S.rankYear === "all") + '">All time</button>' +
      years.map(function(y){
        return '<button data-ry="' + y + '" aria-pressed="' + (S.rankYear === y) + '">' + esc((seasonMeta(y).label || y).replace("Fall ", "")) + '</button>';
      }).join("") + '</div></div>';
    var sortKey = S.rankSort || "r";
    chips += '<div class="filterrow"><span class="flabel">Rank by</span><div class="chips">' +
      [["r","Rating"],["p","Win %"],["titles","Titles"]].map(function(o){
        return '<button data-rs="' + o[0] + '" aria-pressed="' + (sortKey === o[0]) + '">' + o[1] + '</button>';
      }).join("") + '</div></div>';
    var rows = rankRows();
    var body = rows.length ? '<div class="card"><div class="standtbl"><table><thead><tr>' +
      '<th>School</th>' + (S.rankYear === "all" ? '' : '<th>Lvl</th>') + '<th>W</th><th>L</th><th class="w">' + (sortKey === "p" ? "Win%" : "Rating") + '</th>' +
      (S.rankYear === "all" ? '<th>Yrs</th>' : '') + '<th>Ttl</th></tr></thead><tbody>' +
      rows.slice(0, 150).map(function(r, i){
        var pin = r.key.split(":")[1] === PIN;
        return '<tr class="' + (pin || S.favs.has(r.key) ? "isfav" : "") + '"><td><button class="tm" data-hteam="' + esc(r.key) + '">' +
          '<span class="pos">' + (i+1) + '</span><span>' + esc(r.name) + '</span></button></td>' +
          (S.rankYear === "all" ? '' : '<td>' + esc(r.cls) + '</td>') + '<td>' + r.w + '</td><td>' + r.l + '</td>' +
          '<td class="pts w">' + pct3(sortKey === "p" ? r.p : r.r) + '</td>' +
          (S.rankYear === "all" ? '<td>' + r.n + '</td>' : '') +
          '<td>' + (r.titles || "") + '</td></tr>';
      }).join("") + '</tbody></table></div></div>' +
      methodHTML() :
      '<div class="card"><div class="empty">Not enough games on record for this season.</div></div>';
    return '<div class="filters">' + chips + '</div>' +
      '<div class="sectionhead"><span class="eyebrow">' + (S.rankYear === "all" ? "All-time ranking" : esc(seasonMeta(S.rankYear).label || S.rankYear)) + '</span>' +
      '<span class="eyebrow">' + (sortKey === "titles" ? "by titles" : (sortKey === "p" ? "by win percentage" : "by rating")) + '</span></div>' + body;
  }

  /* ---------- history chart ---------- */
  function methodHTML(){
    var inprog = S.rankYear !== "all" && seasonMeta(S.rankYear).cur;
    return '<details class="method"' + (S.methodOpen ? " open" : "") + ' id="method">' +
      '<summary>How the rating is calculated</summary>' +
      '<div class="mbody">' +
      '<p><b>Season rating</b> = level weight &times; (0.75 &times; league points% + 0.25 &times; playoff score). ' +
      'It runs 0 to 1, so .800 is a strong season in the top flight and a perfect record two tiers down lands near .760.</p>' +
      '<p><b>League points%</b> is PSAL\'s own table: 3 points for a win, 1 for a tie, divided by 3 &times; games played. Only league games count \u2014 playoff results enter through the next term.</p>' +
      '<p><b>Playoff score</b>: missed the playoffs 0 \u00b7 qualified .20 \u00b7 round of 16 .30 \u00b7 quarterfinals .45 \u00b7 semifinals .60 \u00b7 lost the final .80 \u00b7 <b>won the title 1.00</b>.</p>' +
      '<p><b>Level weight</b>: top flight &times;1.00, second tier &times;0.88, third &times;0.76, anything below &times;0.68. PSAL renamed its ladder in 2025 \u2014 1A was the <i>top</i> division through 2024 and is the <i>bottom</i> one now \u2014 so the app reads each season\'s own ladder rather than the label. That is also why the all-time table leaves the level column out.</p>' +
      '<p><b>All-time</b> is the average of a school\'s season ratings, weighted by games played, across every season in the archive. Titles counts championships won.</p>' +
      '<p><b>Who appears</b>: 40 games minimum all-time; for a single season, half the leader\'s games played, capped at six.</p>' +
      '<p><b>Forfeits</b> count exactly as PSAL records them \u2014 a forfeit win is a win.' +
      (inprog ? ' This season is still in progress, and PSAL books forfeited fixtures as losses in advance, so a school that withdrew shows a full slate of losses on day one.' : '') + '</p>' +
      '<p><b>Win %</b> = (wins + half of ties) &divide; games played. It ignores level and playoffs entirely \u2014 useful as a sanity check against the rating.</p>' +
      '</div></details>';
  }

  /* ---------- citywide leaders ---------- */
  var LB_STATS = [["g","Goals","G"],["a","Assists","A"],["p","Points","Pts"],["sh","Shots","Sh"],["sv","Saves","Sv"]];
  function seasonAgg(sp){
    var key = S.seasonId + ":" + sp;
    if(S.aggCache[key]) return S.aggCache[key];
    var ps = S.season, P = ps.raw.P, map = {}, list = [];
    ps.raw.G.forEach(function(g){
      if(g[0] !== sp) return;
      var d = ps.raw.X[gkey(g)];
      if(!d || !d[4] || !d[4].length) return;
      d[4].forEach(function(r){
        var nm = P[r[1]] || "";
        if(!nm) return;
        var k = r[0] + "|" + nm, e = map[k];
        if(!e){ e = map[k] = {n:nm, code:r[0], gp:0, g:0, a:0, sv:0, ga:0, sh:0}; list.push(e); }
        e.gp++; e.g += r[2]; e.a += r[3]; e.sv += r[4]; e.sh += r[5]; e.ga += r[6];
      });
    });
    list.forEach(function(e){ e.p = e.g + e.a; });
    S.aggCache[key] = list;
    return list;
  }
  function leadersHTML(){
    if(!S.season || S.season === "error"){
      return '<div class="card"><div class="' + (S.season === "error" ? "empty" : "loading") + '">' +
        (S.season === "error" ? "Couldn't load that season." : "Loading season\u2026") + '</div></div>';
    }
    var ps = S.season;
    var years = META.seasons.map(function(m){ return m.id; });
    var chips = '<div class="filterrow"><span class="flabel">Season</span><div class="chips scroll">' +
      years.map(function(y){
        return '<button data-lby="' + y + '" aria-pressed="' + (y === S.seasonId) + '">' +
          esc((seasonMeta(y).label || y).replace("Fall ", "")) + '</button>';
      }).join("") + '</div></div>';
    /* levels present this season, ordered by tier */
    var tiers = {};
    Object.keys(ps.teams).forEach(function(k){
      var t = ps.teams[k];
      if(t.sp === S.sp && t.cls) tiers[t.cls] = tierOf(t.div);
    });
    var levels = Object.keys(tiers).sort(function(a, b){ return tiers[a] - tiers[b]; });
    chips += '<div class="filterrow"><span class="flabel">Level</span><div class="chips scroll">' +
      '<button data-lbt="all" aria-pressed="' + (S.lbTier === "all") + '">All</button>' +
      levels.map(function(c){
        return '<button data-lbt="' + esc(c) + '" aria-pressed="' + (S.lbTier === c) + '">' + esc(c) + '</button>';
      }).join("") + '</div></div>';
    chips += '<div class="filterrow"><span class="flabel">Stat</span><div class="chips">' +
      LB_STATS.map(function(o){
        return '<button data-lbs="' + o[0] + '" aria-pressed="' + (S.lbStat === o[0]) + '">' + o[1] + '</button>';
      }).join("") + '</div></div>';

    var stat = S.lbStat, rows = seasonAgg(S.sp).filter(function(e){
      if(!e[stat]) return false;
      if(S.lbTier === "all") return true;
      var t = ps.teams[S.sp + ":" + e.code];
      return t && t.cls === S.lbTier;
    });
    rows.sort(function(x, y){
      return (y[stat] - x[stat]) || (y.g - x.g) || (y.a - x.a) || x.n.localeCompare(y.n);
    });
    var meta_ = LB_STATS.filter(function(o){ return o[0] === stat; })[0] || ["", "", ""];
    var label = meta_[1], abbr = meta_[2];
    var body = rows.length ? '<div class="card"><div class="standtbl"><table><thead><tr>' +
      '<th>Player</th><th>GP</th><th class="w">' + esc(abbr) + '</th></tr></thead><tbody>' +
      rows.slice(0, 100).map(function(r, i){
        var t = ps.teams[S.sp + ":" + r.code];
        var pin = r.code === PIN;
        return '<tr class="' + (pin ? "isfav" : "") + '"><td><button class="tm" data-team="' + esc(S.sp + ":" + r.code) + '" style="text-align:left">' +
          '<span class="pos">' + (i+1) + '</span><span>' + esc(titleCase(r.n)) +
          '<br><span style="font-size:11.5px;color:var(--muted)">' + esc(t ? t.short : r.code) + (t && t.cls ? " \u00b7 " + esc(t.cls) : "") + '</span>' +
          '</span></button></td>' +
          '<td>' + r.gp + '</td><td class="pts w">' + r[stat] + '</td></tr>';
      }).join("") + '</tbody></table></div></div>' :
      '<div class="card"><div class="empty">No ' + esc(label.toLowerCase()) + ' recorded yet this season.</div></div>';
    return '<div class="filters">' + chips + '</div>' +
      '<div class="sectionhead"><span class="eyebrow">' + esc(ps.label) + ' \u00b7 ' + esc(label) + '</span>' +
      '<span class="eyebrow">' + (S.lbTier === "all" ? "all levels" : esc(S.lbTier)) + '</span></div>' + body +
      '<div style="font-size:12px;color:var(--muted);padding:6px 2px 0">Totals come from the box scores coaches file with PSAL, so a school that never files stats shows no players here. GP counts games with a stat line, not appearances.</div>';
  }

  function chartHTML(key){
    var e = S.hist && S.hist.teams[key];
    if(!e || !e.s.length) return "";
    var pts = e.s.slice().sort(function(a, b){ return a[0] - b[0]; }).map(function(r){
      return {y:+r[0], label:(seasonMeta(String(r[0])).label || r[0]), w:r[1], l:r[2], t:r[3],
              cls:r[5] || "", res:(r[7] || 0), p:pct(r[1], r[2], r[3]), v:seasonRating(r),
              live:!!seasonMeta(String(r[0])).cur};
    }).filter(function(p){ return (p.w + p.l + p.t) > 0; });
    if(!pts.length) return "";
    window.__chartPts = pts;
    var n = pts.length;
    var titles = pts.filter(function(p){ return p.res === 6; }).length;
    var best = pts.slice().sort(function(a, b){ return b.v - a.v; })[0];
    return '<div class="chartcard"><div class="head"><h3>Season by season</h3>' +
      '<span class="legend">' + n + ' season' + (n === 1 ? "" : "s") +
      (titles ? " \u00b7 " + titles + " title" + (titles === 1 ? "" : "s") : "") + '</span></div>' +
      '<div class="chartbox" id="chartbox"></div>' +
      '<div class="chartnote" id="chartnote">' + esc(noteFor(pts[n-1].live ? pts[n-1] : best)) + '</div></div>';
  }
  function drawChart(){
    var box = el("chartbox"), pts = window.__chartPts;
    if(!box || !pts || !pts.length) return;
    var W = Math.max(240, Math.round(box.clientWidth || 340)), H = 104;
    var PADL = 24, PADR = 8, PADT = 9, PADB = 17;
    var n = pts.length, iw = W - PADL - PADR, ih = H - PADT - PADB;
    function X(i){ return n === 1 ? PADL + iw/2 : PADL + iw * i/(n-1); }
    function Y(v){ return PADT + ih * (1 - v); }
    var liveIdx = -1;
    pts.forEach(function(p, i){ if(p.live) liveIdx = i; });
    var solidTo = (liveIdx === n - 1 && n > 1) ? n - 2 : n - 1;
    var line = pts.slice(0, solidTo + 1).map(function(p, i){
      return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1);
    }).join(" ");
    var tail = (solidTo < n - 1) ?
      '<path class="ln live" d="M' + X(n-2).toFixed(1) + " " + Y(pts[n-2].v).toFixed(1) +
      "L" + X(n-1).toFixed(1) + " " + Y(pts[n-1].v).toFixed(1) + '"></path>' : "";
    var grid = [0, 0.5, 1].map(function(g){
      return '<line class="grid" x1="' + PADL + '" x2="' + (W-PADR) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '"></line>' +
        '<text class="axis" x="0" y="' + (Y(g)+3.5).toFixed(1) + '">' + (g === 1 ? "1.0" : (g === 0 ? "0" : ".5")) + '</text>';
    }).join("");
    var want = Math.max(2, Math.min(W < 330 ? 3 : 5, n)), idxs = [];
    for(var k = 0; k < want; k++){
      var ix = n === 1 ? 0 : Math.round(k * (n - 1) / (want - 1));
      if(idxs.indexOf(ix) === -1) idxs.push(ix);
    }
    var ticks = idxs.map(function(ix){
      var anchor = ix === 0 ? "start" : (ix === n - 1 ? "end" : "middle");
      return '<text class="axis" text-anchor="' + anchor + '" x="' + X(ix).toFixed(1) + '" y="' + (H - 3) + '">' + (pts[ix].y - 1) + '</text>';
    }).join("");
    var dots = pts.map(function(p, i){
      var gold = p.res === 6, silver = p.res === 5;
      var style = gold ? ' style="fill:#E3B341;stroke:#A87C15;stroke-width:1.6"' :
                  (silver ? ' style="fill:#C3CBD6;stroke:#8A96A6;stroke-width:1.6"' : '');
      if(p.live) style = ' style="fill:var(--bg);stroke:var(--orange);stroke-width:1.6;stroke-dasharray:2.6 2"';
      return '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (p.live ? 4.4 : ((gold || silver) ? 4.6 : 2.9)) + '"' +
        style + '></circle>' +
        '<circle class="hit" data-pt="' + i + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="11"></circle>';
    }).join("");
    box.innerHTML = '<svg class="chart" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" id="teamchart">' +
      grid + ticks + '<path class="ln" d="' + line + '"></path>' + tail + dots + '</svg>';
  }
  function noteFor(p){
    return [p.label, p.cls, p.w + "-" + p.l + (p.t ? "-" + p.t : ""),
            (PO_LABEL[p.res] || ""), "rating " + pct3(p.v),
            (p.live ? "in progress" : "")]
      .filter(Boolean).join(" · ");
  }

  function teamSegHTML(key){
    var parts = key.split(":"), sp = +parts[0], code = parts[1];
    function has(x){
      var k = x + ":" + code;
      if(S.season && S.season !== "error" && S.season.teams[k]) return true;
      return !!(S.hist && S.hist.teams && S.hist.teams[k]);
    }
    var names = ["Boys Varsity", "Girls Varsity"];
    return '<div class="seg sheetseg" role="group" aria-label="Boys or girls program">' +
      [0, 1].map(function(x){
        var on = x === sp, ok = has(x) || on;
        return '<button ' + (ok ? 'data-tsp="' + x + ":" + esc(code) + '"' : 'disabled') +
          ' aria-pressed="' + on + '"' + (ok ? '' : ' style="opacity:.42"') + '>' + names[x] + '</button>';
      }).join("") + '</div>';
  }

  function teamYearsHTML(key){
    var parts = key.split(":"), sp = +parts[0], code = parts[1];
    var e = S.hist && S.hist.teams && S.hist.teams[key];
    var ids = {};
    if(e) e.s.forEach(function(r){ ids[String(r[0])] = 1; });
    if(S.season && S.season !== "error" && S.season.teams[key]) ids[S.seasonId] = 1;
    var list = META.seasons.map(function(m){ return m.id; }).filter(function(id){ return ids[id]; });
    if(list.length < 2) return "";
    return '<div class="filterrow sheetyears"><span class="flabel">Season</span><div class="chips scroll">' +
      list.map(function(id){
        return '<button data-tyr="' + esc(id + ":" + sp + ":" + code) + '" aria-pressed="' + (id === S.seasonId) + '">' +
          esc((seasonMeta(id).label || id).replace("Fall ", "")) + '</button>';
      }).join("") + '</div></div>';
  }

  function playerStats(sp, code){
    var ps = S.season, P = ps.raw.P, agg = {}, order = [];
    ps.raw.G.forEach(function(g){
      if(g[0] !== sp || (g[4] !== code && g[5] !== code)) return;
      var d = detailOf(g);
      if(!d || !d[4] || !d[4].length) return;
      d[4].forEach(function(r){
        if(r[0] !== code) return;
        var nm = P[r[1]] || "";
        if(!nm) return;
        var e = agg[nm];
        if(!e){ e = agg[nm] = {n:nm, gp:0, g:0, a:0, sv:0, ga:0, sh:0}; order.push(e); }
        e.gp++; e.g += r[2]; e.a += r[3]; e.sv += r[4]; e.sh += r[5]; e.ga += r[6];
      });
    });
    return order;
  }
  function statsHTML(sp, code){
    var rows = playerStats(sp, code);
    if(!rows.length) return "";
    var field = rows.filter(function(r){ return r.g || r.a || r.sh; })
      .sort(function(x, y){ return (y.g - x.g) || (y.a - x.a) || (y.sh - x.sh) || x.n.localeCompare(y.n); });
    var keepers = rows.filter(function(r){ return r.sv || r.ga; })
      .sort(function(x, y){ return (y.sv - x.sv) || (x.ga - y.ga); });
    if(!field.length && !keepers.length) return "";
    var goals = field.reduce(function(a, r){ return a + r.g; }, 0);
    var out = '<div><div class="grouphead"><h3>Player stats</h3><div class="rule"></div>' +
      '<span class="eyebrow">' + goals + ' goal' + (goals === 1 ? "" : "s") + ' logged</span></div>';
    if(field.length){
      out += '<div class="card"><div class="standtbl"><table><thead><tr>' +
        '<th>Player</th><th>GP</th><th>G</th><th>A</th><th>Sh</th></tr></thead><tbody>' +
        field.map(function(r, i){
          return '<tr><td><span class="tm"><span class="pos">' + (i+1) + '</span><span>' + esc(titleCase(r.n)) + '</span></span></td>' +
            '<td>' + r.gp + '</td><td class="pts">' + (r.g || "") + '</td><td>' + (r.a || "") + '</td><td>' + (r.sh || "") + '</td></tr>';
        }).join("") + '</tbody></table></div></div>';
    }
    if(keepers.length){
      out += '<div class="grouphead" style="padding-top:10px"><h3 style="font-size:12px">Goalkeeping</h3><div class="rule"></div></div>' +
        '<div class="card"><div class="standtbl"><table><thead><tr>' +
        '<th>Player</th><th>GP</th><th>Sv</th><th>GA</th></tr></thead><tbody>' +
        keepers.map(function(r){
          return '<tr><td><span class="tm"><span>' + esc(titleCase(r.n)) + '</span></span></td>' +
            '<td>' + r.gp + '</td><td class="pts">' + (r.sv || "") + '</td><td>' + (r.ga || "") + '</td></tr>';
        }).join("") + '</tbody></table></div></div>';
    }
    return out + '</div>';
  }

  /* ---------- team sheet ---------- */
  function openTeam(key){
    var parts = key.split(":"), sp = +parts[0], code = parts[1];
    S.openTeamKey = key;
    var t = teamOf(sp, code), ps = S.season;
    el("sheet-name").textContent = t.name;
    el("sheet-sub").textContent = [divLabel(t.div), ps.label].filter(Boolean).join(" · ");
    var fav = el("sheet-fav");
    fav.setAttribute("aria-pressed", S.favs.has(key) ? "true" : "false");
    fav.dataset.key = key;
    fav.querySelector("svg").setAttribute("fill", S.favs.has(key) ? "currentColor" : "none");

    var games = ps.raw.G.filter(function(g){ return g[0] === sp && (g[4] === code || g[5] === code); })
      .sort(function(a, b){ return a[2] - b[2]; });
    var today = todayInt();
    var played = games.filter(function(g){ return hasScore(g) || g[2] < today; });
    var upcoming = games.filter(function(g){ return !hasScore(g) && g[2] >= today; });
    var w = 0, l = 0, tie = 0, gf = 0, ga = 0;
    played.forEach(function(g){
      var r = resultFor(g, code);
      if(!r) return;
      if(r.wl === "W") w++; else if(r.wl === "L") l++; else tie++;
      if(!r.ff){ gf += r.gf; ga += r.ga; }
    });
    var rec = ps.rec[key];
    var html = teamSegHTML(key) + teamYearsHTML(key);
    html += S.histState === "ok" ? chartHTML(key) :
      '<div class="chartcard"><div class="head"><h3>Season by season</h3></div>' +
      '<div class="' + (S.histState === "error" ? "empty" : "loading") + '" style="padding:32px 8px">' +
      (S.histState === "error" ? "History unavailable." : "Loading history…") + '</div></div>';
    html += '<div class="statrow">' +
      '<div class="stat"><div class="k">Record</div><div class="v">' + (rec ? rec[1] + "-" + rec[2] + (rec[3] ? "-" + rec[3] : "") : w + "-" + l + (tie ? "-" + tie : "")) + '</div></div>' +
      '<div class="stat"><div class="k">Goals for</div><div class="v">' + gf + '</div></div>' +
      '<div class="stat"><div class="k">Goals against</div><div class="v">' + ga + '</div></div></div>';
    if(played.length){
      var withScore = played.filter(hasScore);
      var withStats = withScore.filter(function(g){ return boxRowsFor(g, code) > 0; });
      var cover = withScore.length ?
        '<span class="eyebrow" style="color:' + (withStats.length === withScore.length ? "var(--muted)" : "var(--orange)") + '">stats ' +
          withStats.length + '/' + withScore.length + '</span>' : "";
      html += '<div><div class="grouphead"><h3>Results</h3><div class="rule"></div>' + cover + '</div><div class="card">' +
        played.map(function(g){ return resLine(g, code); }).join("") + '</div></div>';
      if(withScore.length && withStats.length < withScore.length){
        html += '<div style="font-size:12.5px;color:var(--muted);padding:0 2px">' +
          (withScore.length - withStats.length) + ' of ' + withScore.length +
          ' games have no player stats filed for this school on PSAL.</div>';
      }
    }
    html += statsHTML(sp, code);
    if(upcoming.length){
      html += '<div><div class="grouphead"><h3>Upcoming</h3><div class="rule"></div></div>' +
        '<div class="card"><div class="games">' + upcoming.map(function(g){ return gameHTML(g, {date:true}); }).join("") + '</div></div></div>';
    }
    if(!played.length && !upcoming.length) html += '<div class="card"><div class="empty">No games on the schedule.</div></div>';
    el("sheet-body").innerHTML = html;
    el("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    drawChart();
    if(S.histState !== "ok") needHistory(function(){ if(S.openTeamKey === key) openTeam(key); });
  }
  function resLine(g, code){
    var r = resultFor(g, code);
    var opp = teamOf(g[0], g[4] === code ? g[5] : g[4]);
    var home = g[4] === code;
    var right = r ? (r.ff ? r.gf : (r.gf + "–" + r.ga)) : "<span style='color:var(--muted);font-weight:600;font-size:12px'>No score posted</span>";
    var sub = fmtDate(g[2]) + " · " + (home ? "Home" : "Away") + (locOf(g) ? " · " + locOf(g) : "");
    if(hasScore(g) && !boxRowsFor(g, code)) sub = fmtDate(g[2]) + " · " + (home ? "Home" : "Away") + " · no stats filed";
    if(g[10] === 1) sub = fmtDate(g[2]) + " · " + ((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim();
    return '<button class="resline' + (opp.code === PIN ? " pin" : "") + '" data-game="' + esc(gkey(g)) + '">' +
      '<span class="wl ' + (r ? r.wl : "") + '">' + (r ? r.wl : "·") + '</span>' +
      '<span class="op"><span class="nm">' + esc(opp.short) + '</span><span class="dt">' + esc(sub) + '</span></span>' +
      '<span class="rs">' + right + '</span></button>';
  }
  function closeSheet(){
    el("sheet").hidden = true; S.openTeamKey = null;
    if(el("gsheet").hidden) document.body.style.overflow = "";
  }

  /* ---------- game sheet ---------- */
  function openGame(key){
    var g = null, ps = S.season;
    for(var i=0;i<ps.raw.G.length;i++){ if(gkey(ps.raw.G[i]) === key){ g = ps.raw.G[i]; break; } }
    if(!g) return;
    S.openGameKey = key;
    var h = teamOf(g[0], g[4]), a = teamOf(g[0], g[5]);
    var d = detailOf(g), st = status(g);
    el("gsheet-name").textContent = h.name + " vs " + a.name;
    var subBits = [fmtDateLong(g[2])];
    if(g[3]) subBits.push(fmtTime(g[3]));
    if(g[10] === 1) subBits.push(((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim());
    else if(h.div) subBits.push(divShort(h.div));
    el("gsheet-sub").textContent = subBits.join(" · ");

    var html = "";
    /* score line */
    var hs = g[6], as = g[7], ff = (hs === 999 || as === 999);
    var scoreTxt = hasScore(g) ? (ff ? "Forfeit" : hs + " – " + as) : "—";
    var stChip = st === "final" ? '<span class="chip final">Final</span>' :
                 st === "ppd" ? '<span class="chip ppd">Postponed</span>' :
                 st === "ff" ? '<span class="chip ff">Forfeit</span>' :
                 st === "sus" ? '<span class="chip ppd">Suspended</span>' :
                 '<span class="chip time">' + esc(fmtTime(g[3]) || "Scheduled") + '</span>';
    html += '<div class="boxwrap"><div class="kv" style="padding:14px 13px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
      '<div style="min-width:0"><button data-gteam="' + esc(g[0] + ":" + g[4]) + '" style="text-align:left;display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:16px' +
        (hasScore(g) && !ff && hs > as ? "" : ";color:var(--muted)") + '">' + esc(h.name) +
        ' <span style="font-size:11px;color:var(--muted)">HOME</span> <span style="color:var(--blue);font-size:12px">&rsaquo;</span></button>' +
      '<button data-gteam="' + esc(g[0] + ":" + g[5]) + '" style="text-align:left;display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;margin-top:4px' +
        (hasScore(g) && !ff && as > hs ? "" : ";color:var(--muted)") + '">' + esc(a.name) +
        ' <span style="font-size:11px;color:var(--muted)">AWAY</span> <span style="color:var(--blue);font-size:12px">&rsaquo;</span></button></div>' +
      '<div style="text-align:right;flex:none"><div style="font-family:Archivo,sans-serif;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums">' +
        esc(scoreTxt) + '</div><div style="margin-top:4px">' + stChip + '</div></div></div></div></div>';

    /* halves */
    if(d && (d[2].length || d[3].length)){
      var ph = d[2], pa = d[3];
      var cols = Math.max(ph.length, pa.length);
      var names = ["1st", "2nd", "3rd", "4th", "OT", "OT2", "OT3"];
      var used = [];
      for(var c=0;c<cols;c++){
        if((ph[c] || 0) !== 0 || (pa[c] || 0) !== 0 || c < 2) used.push(c);
      }
      if(used.length){
        html += '<div class="boxwrap"><div class="boxhead"><h3>By half</h3></div>' +
          '<table class="halftbl"><thead><tr><th></th>' +
          used.map(function(c){ return '<th>' + names[c] + '</th>'; }).join("") + '<th>F</th></tr></thead><tbody>' +
          [[h, ph, hs], [a, pa, as]].map(function(row){
            return '<tr><td>' + esc(row[0].short) + '</td>' +
              used.map(function(c){ var v = row[1][c]; return '<td>' + (v == null ? (hasScore(g) ? 0 : "–") : v) + '</td>'; }).join("") +
              '<td class="tot">' + (row[2] == null ? "–" : (row[2] === 999 ? "W" : row[2])) + '</td></tr>';
          }).join("") + '</tbody></table></div>';
      }
    }

    /* box score */
    if(d && d[4] && d[4].length){
      var P = ps.raw.P;
      var rows = d[4].map(function(b){
        return {code:b[0], name:P[b[1]] || "", g:b[2], a:b[3], sv:b[4], sh:b[5], ga:b[6]};
      });
      [[h, g[4]], [a, g[5]]].forEach(function(side){
        var team = side[0], code = side[1];
        var mine = rows.filter(function(r){ return r.code === code; });
        if(!mine.length){
          html += '<div class="boxwrap"><button class="boxhead" data-gteam="' + esc(g[0] + ":" + code) + '" style="width:100%">' +
            '<h3>' + esc(team.short) + ' <span style="color:var(--blue)">&rsaquo;</span></h3>' +
            '<span class="sub">no player stats posted</span></button>' +
            '<div class="empty" style="padding:14px 13px;text-align:left">PSAL has no box score entries for ' +
            esc(team.short) + ' in this game — the other side\'s coach filed stats and theirs didn\'t.</div></div>';
          return;
        }
        var scorers = mine.filter(function(r){ return r.g || r.a; })
          .sort(function(x, y){ return (y.g - x.g) || (y.a - x.a) || x.name.localeCompare(y.name); });
        var keepers = mine.filter(function(r){ return r.sv || r.ga; })
          .sort(function(x, y){ return y.sv - x.sv; });
        var shooters = mine.filter(function(r){ return r.sh && !r.g && !r.a; })
          .sort(function(x, y){ return y.sh - x.sh; });
        var tot = mine.reduce(function(acc, r){ return acc + r.g; }, 0);
        html += '<div class="boxwrap"><button class="boxhead" data-gteam="' + esc(g[0] + ":" + code) + '" style="width:100%">' +
          '<h3>' + esc(team.short) + ' <span style="color:var(--blue)">&rsaquo;</span></h3>' +
          '<span class="sub">' + (tot ? tot + " goal" + (tot === 1 ? "" : "s") + " recorded" : "no scorers posted") + '</span></button>';
        if(scorers.length){
          html += '<div class="plist">' + scorers.map(function(r){
            var bits = [];
            if(r.g) bits.push('<em>G</em> ' + r.g);
            if(r.a) bits.push('<em>A</em> ' + r.a);
            if(r.sh) bits.push('<em>SH</em> ' + r.sh);
            return '<div class="prow"><span class="pn">' + esc(titleCase(r.name)) + '</span>' +
              '<span class="pv">' + bits.join(" &nbsp; ") + '</span></div>';
          }).join("") + '</div>';
        }
        if(keepers.length){
          html += '<div class="plist" style="border-top:1px solid var(--line-soft)">' + keepers.map(function(r){
            var bits = [];
            if(r.sv) bits.push('<em>SV</em> ' + r.sv);
            if(r.ga) bits.push('<em>GA</em> ' + r.ga);
            return '<div class="prow"><span class="pn">' + esc(titleCase(r.name)) + ' <span style="color:var(--muted);font-size:12px">GK</span></span>' +
              '<span class="pv">' + bits.join(" &nbsp; ") + '</span></div>';
          }).join("") + '</div>';
        }
        if(shooters.length){
          html += '<div class="plist" style="border-top:1px solid var(--line-soft)">' + shooters.map(function(r){
            return '<div class="prow"><span class="pn" style="color:var(--text-2)">' + esc(titleCase(r.name)) + '</span>' +
              '<span class="pv"><em>SH</em> ' + r.sh + '</span></div>';
          }).join("") + '</div>';
        }
        html += '</div>';
      });
    } else if(hasScore(g)){
      html += '<div class="card"><div class="empty">PSAL didn\'t post a box score for this game.</div></div>';
    }

    /* details */
    var det = [];
    det.push(["Date", fmtDateLong(g[2]) + (g[3] ? " · " + fmtTime(g[3]) : "")]);
    if(locOf(g)) det.push(["Venue", locOf(g)]);
    if(d && d[0] >= 0 && ps.raw.AD[d[0]]) det.push(["Address", ps.raw.AD[d[0]].replace(/,\s*$/, "").replace(/,/g, ", ")]);
    if(h.div) det.push(["Division", divLabel(h.div) + (a.div && a.div !== h.div ? " / " + divLabel(a.div) : "")]);
    if(g[10] === 1) det.push(["Round", ((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim()]);
    else if(g[10] === 2) det.push(["Type", "Non-league game"]);
    if(reasonOf(g)) det.push(["Status", titleCase(reasonOf(g))]);
    if(d && d[1] && d[1].length) det.push([d[1].length > 1 ? "Referees" : "Referee", d[1].map(function(i){ return ps.raw.R[i]; }).filter(Boolean).join(", ")]);
    if(d && d[5] >= 0 && ps.raw.R[d[5]]) det.push(["Trainer", ps.raw.R[d[5]]]);
    html += '<div class="boxwrap"><div class="boxhead"><h3>Game details</h3></div><div class="kv">' +
      det.map(function(r){ return '<div class="r"><span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + '</span></div>'; }).join("") +
      '</div></div>';

    el("gsheet-body").innerHTML = html;
    el("gsheet").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function titleCase(s){
    s = String(s || "");
    if(s !== s.toUpperCase()) return s;
    return s.toLowerCase().replace(/(^|[\s\-'])([a-z])/g, function(m, a, b){ return a + b.toUpperCase(); });
  }
  function closeGame(){
    el("gsheet").hidden = true; S.openGameKey = null;
    if(el("sheet").hidden) document.body.style.overflow = "";
  }

  /* ---------- shell ---------- */
  function render(){
    ["scores","standings","teams","playoffs","history"].forEach(function(v){
      el("view-" + v).hidden = v !== S.view;
      el("tab-" + v).setAttribute("aria-pressed", v === S.view ? "true" : "false");
    });
    el("sport-0").setAttribute("aria-pressed", S.sp === 0 ? "true" : "false");
    el("sport-1").setAttribute("aria-pressed", S.sp === 1 ? "true" : "false");
    if(S.view === "history"){ renderHistory(); return; }
    if(!S.season || S.season === "error"){
      el("view-" + S.view).innerHTML = '<div class="card"><div class="' + (S.season === "error" ? "empty" : "loading") + '">' +
        (S.season === "error" ? "Couldn't load that season." : "Loading season…") + '</div></div>';
      return;
    }
    if(S.view === "scores") renderScores();
    else if(S.view === "standings") renderStandings();
    else if(S.view === "teams") renderTeams();
    else if(S.view === "playoffs") renderPlayoffs();
  }
  function setStamp(){
    var t = el("stamptext"), stamp = el("stamp");
    if(!isCurrent()){
      stamp.classList.remove("live");
      t.textContent = (S.season && S.season.label ? S.season.label : "") + " archive";
      return;
    }
    stamp.classList.add("live");
    var d = new Date(META.updated);
    t.textContent = isNaN(d) ? "Live" : "Updated " + d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  }
  function openSeasonMenu(){
    var list = el("seasonmenu-list");
    list.innerHTML = META.seasons.map(function(s){
      return '<button data-season="' + esc(s.id) + '" aria-pressed="' + (s.id === S.seasonId) + '">' +
        '<span>' + esc(s.label) + '</span>' + (s.cur ? '<span class="tag">Current</span>' : "") + '</button>';
    }).join("");
    el("seasonmenu").hidden = false;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("button, circle[data-pt]") : null;
    if(!b) return;
    var id = b.id || "";
    if(id.indexOf("tab-") === 0){ S.view = id.slice(4); render(); window.scrollTo(0, 0); return; }
    if(id === "sport-0" || id === "sport-1"){
      S.sp = +id.slice(-1); S.div = "";
      if(S.season && S.season !== "error"){
        var has = (S.season.byDate[S.date] || []).some(function(g){ return g[0] === S.sp; });
        if(!has) S.date = pickDate(S.season, S.sp);
      }
      render(); return;
    }
    if(id === "seasonbtn"){ openSeasonMenu(); return; }
    if(id === "seasonmenu-close"){ el("seasonmenu").hidden = true; return; }
    if(id === "sheet-close"){ closeSheet(); return; }
    if(id === "gsheet-close"){ closeGame(); return; }
    if(id === "clearf"){ S.boro = ""; S.div = ""; render(); return; }
    if(id === "sheet-fav"){ toggleFav(b.dataset.key); return; }
    if(id === "hsub-champs"){ S.hsub = "champs"; render(); return; }
    if(id === "hsub-rank"){ S.hsub = "rank"; render(); return; }
    if(id === "hsub-leaders"){ S.hsub = "leaders"; render(); return; }
    if(b.dataset.lbs){ S.lbStat = b.dataset.lbs; render(); return; }
    if(b.dataset.lbt){ S.lbTier = b.dataset.lbt; render(); return; }
    if(b.dataset.lby){
      var ly = b.dataset.lby;
      if(ly !== S.seasonId) loadSeason(ly, function(){ S.view = "history"; S.hsub = "leaders"; render(); });
      return;
    }
    if(b.dataset.season){
      el("seasonmenu").hidden = true;
      if(b.dataset.season !== S.seasonId) loadSeason(b.dataset.season);
      return;
    }
    if(b.dataset.date){ S.date = +b.dataset.date; render(); return; }
    if(b.dataset.boro != null && b.hasAttribute("data-boro")){ S.boro = b.dataset.boro; S.div = ""; render(); return; }
    if(b.dataset.div != null && b.hasAttribute("data-div")){ S.div = b.dataset.div; render(); return; }
    if(b.dataset.ry){ S.rankYear = b.dataset.ry; render(); return; }
    if(b.dataset.rs){ S.rankSort = b.dataset.rs; render(); return; }
    if(b.dataset.tyr){
      var bits = b.dataset.tyr.split(":"), yid = bits[0], ykey = bits[1] + ":" + bits[2];
      if(yid === S.seasonId){ return; }
      S.openTeamKey = ykey;
      el("sheet-body").innerHTML = '<div class="card"><div class="loading">Loading ' +
        esc(seasonMeta(yid).label || yid) + '\u2026</div></div>';
      loadSeason(yid, function(){
        if(S.season && S.season !== "error" && S.season.teams[ykey]) openTeam(ykey);
        else openHistTeam(ykey);
      });
      return;
    }
    if(b.dataset.tsp){
      var tk = b.dataset.tsp;
      S.sp = +tk.split(":")[0];
      if(S.season && S.season !== "error" && S.season.teams[tk]) openTeam(tk);
      else openHistTeam(tk);
      render();
      return;
    }
    if(b.dataset.gteam){ closeGame(); openTeam(b.dataset.gteam); return; }
    if(b.dataset.team){ openTeam(b.dataset.team); return; }
    if(b.dataset.hteam){ openHistTeam(b.dataset.hteam); return; }
    if(b.dataset.game){ openGame(b.dataset.game); return; }
  });
  document.addEventListener("click", function(ev){
    var c = ev.target;
    if(c && c.tagName === "circle" && c.getAttribute("data-pt") != null){
      var i = +c.getAttribute("data-pt"), p = (window.__chartPts || [])[i];
      var note = el("chartnote");
      if(p && note) note.textContent = noteFor(p);
      var svg = el("teamchart");
      if(svg) Array.prototype.forEach.call(svg.querySelectorAll(".pt"), function(el2, j){ el2.classList.toggle("sel", j === i); });
    }
  }, true);
  function openHistTeam(key){
    var code = key.split(":")[1];
    if(S.season && S.season.teams[key]){ openTeam(key); return; }
    /* team not in the loaded season: show its history card only */
    S.openTeamKey = key;
    var e = S.hist && S.hist.teams[key];
    el("sheet-name").textContent = e ? e.n : "School " + code;
    el("sheet-sub").textContent = "All seasons on record";
    el("sheet-fav").setAttribute("aria-pressed", S.favs.has(key) ? "true" : "false");
    el("sheet-fav").dataset.key = key;
    el("sheet-body").innerHTML = teamSegHTML(key) + teamYearsHTML(key) + chartHTML(key) + (e ? '<div class="card"><div class="standtbl"><table><thead><tr>' +
      '<th>Season</th><th>W</th><th>L</th><th>T</th><th>Pts</th></tr></thead><tbody>' +
      e.s.slice().sort(function(a, b){ return b[0] - a[0]; }).map(function(r){
        return '<tr><td>' + esc(seasonMeta(String(r[0])).label || r[0]) + '</td><td>' + r[1] + '</td><td>' + r[2] +
          '</td><td>' + r[3] + '</td><td class="pts">' + r[4] + '</td></tr>';
      }).join("") + '</tbody></table></div></div>' : "");
    el("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    drawChart();
  }
  var __rsz;
  window.addEventListener("resize", function(){
    clearTimeout(__rsz);
    __rsz = setTimeout(function(){ if(!el("sheet").hidden) drawChart(); }, 180);
  });
  document.addEventListener("toggle", function(ev){
    if(ev.target && ev.target.id === "method") S.methodOpen = ev.target.open;
  }, true);
  document.addEventListener("input", function(ev){
    if(ev.target && ev.target.id === "tsearch"){
      S.query = ev.target.value;
      renderTeams();
      var i = el("tsearch");
      if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    }
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape"){
      if(!el("gsheet").hidden) closeGame();
      else if(!el("sheet").hidden) closeSheet();
      else if(!el("seasonmenu").hidden) el("seasonmenu").hidden = true;
    }
  });
  el("seasonmenu").addEventListener("click", function(ev){
    if(ev.target === el("seasonmenu")) el("seasonmenu").hidden = true;
  });

  /* ---------- boot ---------- */
  loadFavs();
  S.cache[BOOT.season.id] = parseSeason(BOOT.season);
  applySeason(S.cache[BOOT.season.id]);
})();
</script>
