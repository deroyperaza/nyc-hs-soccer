<meta charset="utf-8">
<title>NYC High School Soccer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#293955">
<!-- Player pages are noindexed: the data is PSAL's and public, but a per-child
     profile page is an aggregation PSAL doesn't publish, and most of these
     players are minors. robots.txt disallows /player/ as well. -->
<meta name="robots" id="robotsmeta" content="index,follow">
<meta property="og:site_name" content="NYC High School Soccer">
<meta property="og:title" content="NYC High School Soccer">
<meta property="og:description" content="Scores, standings, rosters and 26 seasons of history for PSAL high school soccer.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NYC HS Soccer">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="icon" type="image/png" sizes="512x512" href="/tile-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root{
    --navy:#293955; --navy-deep:#1B2740; --orange:#F0742F; --blue:#4C6FC4;
    --bg:#F1F4F9; --surface:#FFFFFF; --surface-2:#E8EDF5; --line:#D8E0EC; --line-soft:#E7ECF4;
    --text:#141C2B; --text-2:#36435A; --muted:#5B6880;
    --win:#12795A; --loss:#A23B22; --tie:#8A6A16; --chip:#EDF1F8;
    --shadow:0 1px 2px rgba(20,28,43,.06), 0 6px 18px rgba(20,28,43,.06);
    --sel-bg:#293955; --sel-fg:#FFFFFF;
    --fav-bg:rgba(240,116,47,.10); --fav-line:#F0742F;
    --shirt:#36435A; --shirt-num:#FFFFFF;
    --radius:14px; --nav-h:62px; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#16223A; --navy-deep:#0B1320; --orange:#FA8A4E; --blue:#7A9BE8;
      --bg:#0C1320; --surface:#141E31; --surface-2:#1B2840; --line:#25344E; --line-soft:#1F2C44;
      --text:#E9EEF7; --text-2:#C2CCDE; --muted:#8494AE;
      --win:#3FBE92; --loss:#E58363; --tie:#D6AE4E; --chip:#1B2840;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
      --sel-bg:#FFFFFF; --sel-fg:#0B1320;
      --fav-bg:rgba(250,138,78,.16); --fav-line:#FA8A4E;
      --shirt:#E9EEF7; --shirt-num:#16223A;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#16223A; --navy-deep:#0B1320; --orange:#FA8A4E; --blue:#7A9BE8;
    --bg:#0C1320; --surface:#141E31; --surface-2:#1B2840; --line:#25344E; --line-soft:#1F2C44;
    --text:#E9EEF7; --text-2:#C2CCDE; --muted:#8494AE;
    --win:#3FBE92; --loss:#E58363; --tie:#D6AE4E; --chip:#1B2840;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    --shirt:#E9EEF7; --shirt-num:#16223A;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  h1,h2,h3{font-family:"Archivo", system-ui, sans-serif; margin:0; text-wrap:balance}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
  :focus-visible{outline:2px solid var(--orange); outline-offset:2px; border-radius:6px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .topbar{position:sticky; top:0; z-index:30; background:var(--navy); color:#fff; box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .topbar-inner{
    max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:10px;
    padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 12px;
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; row-gap:5px}
  .brand{display:flex; align-items:center; gap:8px; min-width:0; flex:1}
  .brand .home{display:flex; align-items:center; gap:8px; min-width:0; color:inherit; text-align:left}
  .brand .home:active{opacity:.6}
  .brand .logo{flex:none; width:24px; height:24px; display:block}
  .brand .logo svg{width:24px; height:24px; display:block}
  .brand .mark{
    font-family:"Archivo", sans-serif; font-weight:800; font-size:17px;
    letter-spacing:-.022em; text-transform:none; white-space:nowrap;
  }
  .brand .mark em{font-style:normal; color:var(--orange)}
  .brand .season{
    display:flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; flex:none; margin-left:auto;
    background:rgba(255,255,255,.12); color:#E4EBF6; border:none;
    font-family:"Archivo",sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  }
  .brand .season .caret{width:0; height:0; border-left:3.5px solid transparent; border-right:3.5px solid transparent; border-top:4px solid currentColor; opacity:.8}
  .brand .season.past{background:var(--orange); color:#fff}
  .stamp{display:flex; align-items:center; gap:6px; font-size:11.5px; color:#A9BAD6; letter-spacing:.02em; flex:none; margin-left:auto}
  @media (max-width:520px){
    .brand{flex:1 1 100%}
    .brand .mark{font-size:16px}
    .stamp{flex:1 1 100%; justify-content:flex-start; margin-left:0}
  }
  .pulse{width:7px; height:7px; border-radius:50%; background:var(--orange); flex:none}
  @media (prefers-reduced-motion:no-preference){ .live .pulse{animation:blink 2.6s ease-in-out infinite} }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .seg{display:flex; background:rgba(255,255,255,.1); border-radius:10px; padding:3px; gap:3px}
  .seg button{flex:1; padding:7px 10px; border-radius:8px; color:#CBD7EA; font-family:"Archivo",sans-serif; font-weight:600; font-size:13px; letter-spacing:.06em; text-transform:uppercase}
  .seg button[aria-pressed="true"]{background:#fff; color:var(--navy-deep)}

  /* ---------- shell ---------- */
  main{max-width:760px; margin:0 auto; padding:14px 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 26px)}
  .view{display:flex; flex-direction:column; gap:14px}
  .view[hidden], [hidden]{display:none !important}
  .eyebrow{font-family:"Archivo",sans-serif; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .sectionhead{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .loading{padding:26px 16px; text-align:center; color:var(--muted); font-size:14px}

  /* ---------- date rail ---------- */
  .rail{
    display:flex; gap:7px; overflow-x:auto; scrollbar-width:none;
    position:sticky; top:var(--hdr, 0px); z-index:20;
    background:var(--bg); padding:8px 16px 7px; margin:-8px -16px 0;
    box-shadow:0 1px 0 var(--line-soft);
  }
  .rail::-webkit-scrollbar{display:none}
  .daybtn{flex:none; min-width:60px; padding:8px 10px; border-radius:12px; background:var(--surface-2); border:1px solid transparent; display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--text-2)}
  .daybtn .dow{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .daybtn .dnum{font-family:"Archivo",sans-serif; font-weight:700; font-size:17px}
  .daybtn .dot{width:4px; height:4px; border-radius:50%; background:var(--orange); opacity:0}
  .daybtn.has .dot{opacity:1}
  .daybtn[aria-pressed="true"]{background:var(--sel-bg); border-color:var(--sel-bg); color:var(--sel-fg); box-shadow:var(--shadow)}
  .daybtn[aria-pressed="true"] .dow{color:var(--sel-fg); opacity:.66}

  /* ---------- game cards ---------- */
  .group{display:flex; flex-direction:column; gap:0}
  .grouphead{display:flex; align-items:center; gap:8px; padding:14px 2px 7px}
  .grouphead h3{font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2)}
  .grouphead .rule{flex:1; height:1px; background:var(--line)}
  .card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow)}
  .games{display:flex; flex-direction:column}
  .games .game + .game{border-top:1px solid var(--line-soft)}
  .game{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:11px 13px; width:100%; text-align:left; align-items:center}
  .game.pin{background:var(--fav-bg); box-shadow:inset 3px 0 0 var(--fav-line)}
  .side{display:flex; align-items:center; gap:8px; min-width:0}
  .side .nm{font-family:"Archivo",sans-serif; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .side .ha{font-size:10px; font-weight:600; letter-spacing:.08em; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 4px; flex:none}
  .side.win .nm{color:var(--text)}
  .side.lose .nm{color:var(--muted); font-weight:500}
  .sc{font-family:"Archivo",sans-serif; font-weight:800; font-size:19px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}
  .sc.win{color:var(--text)}
  .gmeta{grid-column:1 / -1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:3px; font-size:12px; color:var(--muted)}
  .gmeta .venue{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .chip{font-family:"Archivo",sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--chip); color:var(--text-2)}
  .chip.time{background:transparent; border:1px solid var(--line); color:var(--text-2)}
  .chip.final{background:var(--navy); color:#fff}
  .chip.ppd{background:rgba(214,174,78,.18); color:var(--tie)}
  .chip.ff{background:rgba(162,59,34,.14); color:var(--loss)}
  .chip.fav{background:rgba(234,99,33,.14); color:var(--orange)}
  .chip.po{background:rgba(76,111,196,.16); color:var(--blue)}
  .chip.cls{background:rgba(41,57,85,.1); color:var(--text-2)}
  .star{flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; color:var(--muted)}
  .star[aria-pressed="true"]{color:var(--orange)}
  .star svg{width:17px; height:17px}

  /* ---------- tables / standings ---------- */
  .chips{display:flex; gap:7px; flex-wrap:wrap}
  .chips button{padding:6px 12px; border-radius:999px; border:1px solid transparent; background:var(--surface-2); font-family:"Archivo",sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.03em; color:var(--text-2)}
  .chips button[aria-pressed="true"]{background:var(--sel-bg); border-color:var(--sel-bg); color:var(--sel-fg); font-weight:700; box-shadow:var(--shadow)}
  .chips.scroll{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:1px 0 3px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chips.scroll button{flex:none; white-space:nowrap}
  .filters{display:flex; flex-direction:column; gap:9px}
  .filterrow{display:flex; align-items:center; gap:9px; min-width:0}
  .flabel{font-family:"Archivo",sans-serif; font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); width:58px; flex:none}
  .clearbtn{padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-family:"Archivo",sans-serif; font-size:12.5px; font-weight:600; color:var(--text-2)}
  table{width:100%; border-collapse:collapse}
  .standtbl{padding:6px 4px 8px}
  .standtbl table{table-layout:fixed; width:100%}
  .standtbl th:first-child, .standtbl td:first-child{width:auto; max-width:0; overflow:hidden}
  /* Every pixel these columns do not need belongs to the school name, which is
     the only one that can run out of room. W-L-T had 84px for a string that is
     five characters most of the season, and the slack read as a gap between
     the level and the record rather than as breathing space. */
  .standtbl th:not(:first-child), .standtbl td:not(:first-child){width:30px; padding-left:3px; padding-right:5px}
  .standtbl th.w, .standtbl td.w{width:46px}
  .standtbl th:last-child, .standtbl td:last-child{width:34px}
  .standtbl th.lv, .standtbl td.lv{width:26px}
  .standtbl th.rec, .standtbl td.rec{width:58px; font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
  /* The headings are set tighter than the body so RATING and TTL fit inside
     columns sized for .925 and 1 rather than for their own labels. */
  .standtbl th{font-family:"Archivo",sans-serif; font-size:9.5px; font-weight:700;
               letter-spacing:.03em; text-transform:uppercase; color:var(--muted);
               text-align:right; padding:6px 8px; white-space:nowrap}
  .standtbl th:first-child{text-align:left; padding-left:12px; padding-right:10px;
                           font-size:10.5px; letter-spacing:.1em}
  .standtbl td{padding:7px 8px; text-align:right; font-variant-numeric:tabular-nums; border-top:1px solid var(--line-soft)}
  .standtbl td:first-child{text-align:left; padding-left:12px; padding-right:10px}
  .standtbl tbody tr:first-child td{border-top:none}
  .standtbl .tm{display:flex; align-items:center; gap:7px; min-width:0; width:100%}
  .standtbl .tm span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  /* A flex item will not shrink below its content unless it is told it may, so
     without this the name kept its full width, the button overflowed the cell,
     and the cell clipped it -- a hard cut with no ellipsis, which reads as a
     rendering fault rather than as a name that did not fit. */
  .standtbl .tm span:last-child{flex:1 1 auto; min-width:0; text-align:left}
  .standtbl .pos{font-family:"Archivo",sans-serif; font-size:11px; font-weight:700; color:var(--muted); min-width:16px; flex:none; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
  .standtbl .pts{font-family:"Archivo",sans-serif; font-weight:700}
  .standtbl tr.isfav td{background:var(--fav-bg)}
  .standtbl tr.isfav td:first-child{box-shadow:inset 3px 0 0 var(--fav-line)}
  .standtbl tr.isfav .tm span:last-child{font-weight:700; color:var(--text)}
  .standtbl tr.isfav .pos{color:var(--orange)}
  .standtbl tr.gold .pos{color:#B8860B}

  /* ---------- teams ---------- */
  .search{display:flex; align-items:center; gap:9px; padding:10px 13px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
  .search input{flex:1; border:none; background:none; font-family:inherit; font-size:16px;
    color:var(--text); min-width:0}
  .search input:focus{outline:none}
  .search svg{width:16px; height:16px; color:var(--muted); flex:none}
  .tlist{display:flex; flex-direction:column}
  .trow{display:flex; align-items:center; gap:10px; padding:11px 13px; width:100%; text-align:left; border-top:1px solid var(--line-soft)}
  .tlist .trow:first-child{border-top:none}
  .trow .info{flex:1; min-width:0; display:flex; flex-direction:column}
  .trow .nm{display:block; font-family:"Archivo",sans-serif; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .trow .sub{display:block; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .trow .rec{font-family:"Archivo",sans-serif; font-weight:700; font-size:13px; color:var(--text-2); font-variant-numeric:tabular-nums}
  .trow.pin{background:var(--fav-bg); box-shadow:inset 3px 0 0 var(--fav-line)}
  .boro{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .boro + .boro{margin-top:10px}
  .boro summary{
    list-style:none; cursor:pointer; padding:13px 14px; display:flex; align-items:center; gap:10px;
    font-family:"Archivo",sans-serif; font-weight:700; font-size:15px;
  }
  .boro summary::-webkit-details-marker{display:none}
  .boro summary::after{
    content:""; margin-left:auto; width:0; height:0; flex:none;
    border-left:4.5px solid transparent; border-right:4.5px solid transparent;
    border-top:6px solid var(--muted); transition:transform .15s;
  }
  .boro[open] summary::after{transform:rotate(180deg)}
  .boro[open] summary{border-bottom:1px solid var(--line-soft)}
  .boro .bcount{
    font-family:"Archivo",sans-serif; font-size:11.5px; font-weight:700; color:var(--muted);
    background:var(--chip); border-radius:999px; padding:2px 8px;
  }

  /* ---------- sheets ---------- */
  .sheet{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:var(--bg)}
  .sheet[hidden]{display:none}
  /* kills double-tap zoom on a tap-heavy UI; pinch-to-zoom stays available */
  button, input, select, textarea, a, label, summary{touch-action:manipulation}
  .sheet.two{z-index:70}
  .sheet.three{z-index:80}
  .plink{color:var(--blue); text-align:left; font:inherit}
  .prow .plink{font-weight:600}
  .rosterbtn{width:100%; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:11px 13px; border-top:1px solid var(--line-soft);
    font-size:12.5px; font-weight:600; color:var(--text-2); text-align:left}
  .rosterbtn .ch{color:var(--blue); font-size:12px; flex:none}
  .prow.dnp .pn{color:var(--muted); font-weight:500}
  .prow.dnp .pv{color:var(--muted)}
  .careerbar{display:flex; gap:0; border-top:1px solid var(--line-soft)}
  /* direct children only -- the value and label inside each cell are divs too,
     so a bare ".careerbar div" padded them as well and drew a border down each
     of them, which is where the stray short lines came from */
  .careerbar > div{flex:1; padding:9px 6px 10px; text-align:center}
  .careerbar .v{font-family:Archivo,sans-serif; font-weight:800; font-size:19px; line-height:1.1; font-variant-numeric:tabular-nums}
  .careerbar .k{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:1px}
  .glog{width:100%; border-collapse:collapse; font-size:13px}
  .glog th{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    font-weight:600; text-align:right; padding:7px 6px; border-bottom:1px solid var(--line-soft)}
  .glog th:first-child, .glog td:first-child{text-align:left; padding-left:13px}
  .glog td{padding:9px 6px; text-align:right; border-bottom:1px solid var(--line-soft);
    font-variant-numeric:tabular-nums}
  .glog tr:last-child td{border-bottom:0}
  .glog td:last-child, .glog th:last-child{padding-right:13px}
  .glog .op{font-weight:600}
  .glog .wl{font-weight:700; font-size:11px}
  .glog .wl.W{color:var(--win)} .glog .wl.L{color:var(--loss)} .glog .wl.T{color:var(--tie)}
  .glog .zero{color:var(--muted)}
  .pnote{padding:11px 13px; font-size:12px; color:var(--muted); line-height:1.45}
  .psearch{display:flex; gap:8px; align-items:center; padding:0 13px 10px}
  .psearch input{flex:1; min-width:0; height:40px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); padding:0 12px; font-family:Barlow,sans-serif;
    font-size:16px; -webkit-appearance:none}
  .psearch input::placeholder{color:var(--muted)}
  .psearch select{height:40px; max-width:44%; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--text-2); font-family:Barlow,sans-serif;
    font-size:16px; font-weight:600; padding:0 6px}
  .presult{display:flex; align-items:center; gap:10px; width:100%; padding:11px 13px;
    border-top:1px solid var(--line-soft); text-align:left}
  .presult:first-child{border-top:0}
  /* the name and the school are spans inside a button: without display:block
     they run together on one line, and the button's own centring wins */
  .presult .who{flex:1; min-width:0; text-align:left}
  .presult .nm{display:block; font-family:Archivo,sans-serif; font-weight:700; font-size:14.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .presult .mt{display:block; font-size:11.5px; color:var(--muted); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .presult .star{flex:none; width:32px; height:32px; display:flex; align-items:center;
    justify-content:center; color:var(--muted)}
  .presult .star svg{width:17px; height:17px}
  .presult .star[aria-pressed="true"]{color:var(--orange)}
  .presult.isfav{background:var(--fav-bg); box-shadow:inset 3px 0 0 var(--fav-line)}
  .presult{background:var(--surface)}
  .grip{flex:none; width:26px; height:32px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:grab; touch-action:none}
  .grip svg{width:16px; height:16px}
  .presult.dragging{position:relative; z-index:3; cursor:grabbing;
    box-shadow:0 6px 18px rgba(0,0,0,.28); border-radius:8px}
  #favlist .presult{transition:transform .14s ease}
  #favlist .presult.dragging{transition:none}
  .syncbox{padding:12px 13px 14px; border-top:1px solid var(--line-soft);
    display:flex; flex-direction:column; align-items:center; gap:10px}
  .qr{background:#fff; padding:10px; border-radius:10px; line-height:0; min-height:40px}
  .qr img, .qr canvas{display:block}
  .syncin{width:100%; border-top:1px solid var(--line-soft); padding-top:12px;
    display:flex; flex-direction:column; gap:8px}
  .synclink{display:flex; gap:8px; width:100%}
  .synclink input{flex:1; min-width:0; height:38px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-2); padding:0 10px; font-size:16px;
    font-family:Barlow,sans-serif; -webkit-appearance:none}
  .synclink button{height:38px; padding:0 14px; border-radius:9px; border:0;
    background:var(--sel-bg); color:var(--sel-fg); font-weight:700; font-size:13px}
  .alsorow{display:block; width:100%; padding:11px 13px; border-top:1px solid var(--line-soft);
    text-align:left; font-size:13px; color:var(--blue)}
  .alsorow .q{color:var(--muted); font-size:11.5px; display:block; margin-top:2px}
  .sheethead{background:var(--navy); color:#fff; padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 16px}
  .sheethead .row{display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:760px; margin:0 auto}
  .sheethead h2{font-size:20px; font-weight:700; line-height:1.2}
  .sheethead .sub{font-size:12.5px; color:#AEBED6; margin-top:3px}
  .sheetbody{flex:1; overflow-y:auto; padding:14px 16px calc(24px + env(safe-area-inset-bottom, 0px))}
  .sheetbody-inner{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
  .sheetseg{background:var(--surface-2); padding:4px; border-radius:11px}
  .sheetyears{margin-top:-2px}
  .sheetyears .flabel{width:52px}
  .sheetseg button{color:var(--text-2); font-size:12.5px; background:transparent; border:1px solid transparent}
  .sheetseg button[aria-pressed="true"]{background:var(--sel-bg); color:var(--sel-fg); border-color:var(--sel-bg); font-weight:700; box-shadow:var(--shadow)}
  .sheetseg button.off{color:var(--muted); opacity:.6}
  /* selected pills always take the paired foreground, even over inline color */
  .seg button[aria-pressed="true"], .chips button[aria-pressed="true"],
  .daybtn[aria-pressed="true"]{color:var(--sel-fg) !important}
  .topbar .seg button[aria-pressed="true"]{color:var(--navy-deep) !important}
  .statrow{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .stat{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:11px 12px; box-shadow:var(--shadow)}
  .stat .k{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .stat .v{font-family:"Archivo",sans-serif; font-weight:800; font-size:21px; font-variant-numeric:tabular-nums; margin-top:2px}
  .iconbtn{width:34px; height:34px; display:grid; place-items:center; border-radius:9px; background:rgba(255,255,255,.12); color:#fff; flex:none}
  .iconbtn svg{width:17px; height:17px}
  /* the follow buttons in a sheet header carry aria-pressed but had no pressed
     state, so tapping one saved the follow and looked like nothing happened */
  .iconbtn[aria-pressed="true"]{background:var(--orange); color:#fff}
  .iconbtn[aria-pressed="true"] svg{fill:currentColor}
  .resline{display:flex; align-items:center; gap:9px; padding:10px 13px; border-top:1px solid var(--line-soft); width:100%; text-align:left}
  .resline:first-child{border-top:none}
  .resline.pin{background:var(--fav-bg); box-shadow:inset 3px 0 0 var(--fav-line)}
  .resline .wl{font-family:"Archivo",sans-serif; font-weight:800; font-size:12px; width:19px; height:19px; display:grid; place-items:center; border-radius:5px; flex:none; color:#fff; background:var(--muted)}
  .resline .wl.W{background:var(--win)} .resline .wl.L{background:var(--loss)} .resline .wl.T{background:var(--tie)}
  .resline .op{flex:1; min-width:0; display:flex; flex-direction:column}
  .resline .op .nm{display:block; font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .resline .op .dt{display:block; font-size:12px; color:var(--muted)}
  .resline .rs{font-family:"Archivo",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; font-size:14.5px}

  /* ---------- history chart ---------- */
  .chartcard{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); padding:11px 13px 9px}
  .chartcard .head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .chartcard .head h3{font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2)}
  .chartcard .head .legend{font-size:11.5px; color:var(--muted)}
  .chartbox{width:100%; height:104px}
  .chart{display:block; touch-action:pan-y; max-width:100%}
  .chart .grid{stroke:var(--line-soft); stroke-width:1}
  .chart .axis{fill:var(--muted); font-size:11px; font-family:"Barlow",sans-serif}
  .chart .ln{fill:none; stroke:var(--orange); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  .chart .pt{fill:var(--surface); stroke:var(--orange); stroke-width:1.8}
  .chart .pt.sel{fill:var(--orange)}
  .chart .ln.live{stroke-dasharray:4 3; opacity:.85}
  .chartcard .legend .live{color:var(--orange)}
  .chart .hit{fill:transparent; cursor:pointer}
  .chartnote{font-size:12px; color:var(--muted); margin-top:2px; min-height:17px}
  .chartcard .head h3{white-space:nowrap}

  /* ---------- box score ---------- */
  .boxwrap{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .boxhead{padding:11px 13px 7px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line-soft)}
  .boxhead h3{font-size:13px; font-weight:700; letter-spacing:.04em;
              text-transform:uppercase; color:var(--text-2);
              display:flex; align-items:center; gap:5px}
  .boxhead .sub{font-size:12px; color:var(--muted)}
  /* Jersey number. PSAL records one for about three quarters of players, so
     this has to look deliberate when it is there and leave no hole when it is
     not -- hence a fixed-width slot that collapses when empty. */
  /* A number on a shirt reads as a squad number in a way a coloured chip does
     not. Solid silhouette, no outline: the shirt takes the page's ink colour
     and the number is knocked out of it, so it flips with the theme and never
     needs a stroke to hold its edge. The one in the player-page header always
     runs white, because it sits on navy in both themes. */
  .jersey{display:inline-block; line-height:0; flex:none}
  .jersey svg{display:block; width:30px; height:30px}
  .jersey path{fill:var(--shirt)}
  .jersey text{fill:var(--shirt-num); font-family:"Archivo",system-ui,sans-serif;
               font-weight:700}
  .jersey.big svg{width:44px; height:44px}
  .jersey.big path{fill:#FFFFFF}
  .jersey.big text{fill:#293955}
  .jersey.sm svg{width:25px; height:25px}
  /* the name line becomes a row so the shirt sits on the text's centre */
  .presult .nm{display:flex; align-items:center; gap:8px}
  .prow .pos{color:var(--muted); font-size:11px}
  .plist{display:flex; flex-direction:column}
  .prow{display:flex; align-items:center; gap:10px; padding:8px 13px; border-top:1px solid var(--line-soft); font-size:14px}
  .prow:first-child{border-top:none}
  .prow .pn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
            white-space:nowrap; display:flex; align-items:center; gap:7px}
  .prow .pn > button{overflow:hidden; text-overflow:ellipsis}
  .prow .pv{font-family:"Archivo",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-2); font-size:13px; white-space:nowrap}
  .prow .pv em{font-style:normal; color:var(--muted); font-weight:600; font-size:11.5px; letter-spacing:.04em}
  .halftbl th, .halftbl td{padding:6px 8px; text-align:center; font-variant-numeric:tabular-nums}
  .halftbl th{font-family:"Archivo",sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .halftbl td{border-top:1px solid var(--line-soft)}
  .halftbl th:first-child, .halftbl td:first-child{text-align:left; padding-left:13px; width:100%}
  .halftbl td.tot{font-family:"Archivo",sans-serif; font-weight:800}
  .kv{display:flex; flex-direction:column; gap:7px; padding:11px 13px}
  .kv .r{display:flex; gap:10px; font-size:13.5px}
  .kv .r .k{color:var(--muted); width:86px; flex:none; font-size:12px; letter-spacing:.04em; text-transform:uppercase; font-family:"Archivo",sans-serif; font-weight:600}
  .kv .r .v{flex:1; min-width:0}

  .final{display:flex; align-items:center; gap:11px; padding:10px 13px; border-top:1px solid var(--line-soft)}
  .card .final:first-child{border-top:none}
  .final .lvl{font-family:"Archivo",sans-serif; font-weight:800; font-size:12px; letter-spacing:.06em; color:var(--text-2);
    background:var(--chip); border-radius:6px; padding:3px 7px; flex:none; min-width:30px; text-align:center}
  .final .lvl .tag2{display:block; font-size:8.5px; font-weight:700; letter-spacing:.08em; color:var(--muted); margin-top:1px}
  .final .pair{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .final .side{display:flex; align-items:center; gap:7px; min-width:0; width:100%; text-align:left; padding:0}
  .final .side .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14.5px}
  .final .side.win .nm{font-family:"Archivo",sans-serif; font-weight:700}
  .final .side:not(.win) .nm{color:var(--muted)}
  .final .side .nm.pin{color:var(--orange); font-weight:700}
  .final:has(.nm.pin){background:var(--fav-bg); box-shadow:inset 3px 0 0 var(--fav-line)}
  .final .side .sc{font-family:"Archivo",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; font-size:14px; flex:none}
  .final .side:not(.win) .sc{color:var(--muted)}
  .final .medal{width:9px; height:9px; border-radius:50%; flex:none}
  .final .medal.gold{background:#E3B341; box-shadow:inset 0 0 0 1.4px #A87C15}
  .final .medal.silver{background:#C3CBD6; box-shadow:inset 0 0 0 1.4px #8A96A6}
  .final .when{font-size:11.5px; color:var(--muted); flex:none; white-space:nowrap}

  .method{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); margin-top:2px}
  .method summary{list-style:none; cursor:pointer; padding:12px 14px; font-family:"Archivo",sans-serif; font-weight:600; font-size:13.5px; color:var(--blue); display:flex; align-items:center; gap:7px}
  .method summary::-webkit-details-marker{display:none}
  .method summary::after{content:""; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor; opacity:.7; transition:transform .15s}
  .method[open] summary::after{transform:rotate(180deg)}
  .method .mbody{padding:0 14px 12px; font-size:13px; color:var(--text-2); line-height:1.55}
  .method .mbody p{margin:0 0 9px}
  .method .mbody p:last-child{margin-bottom:0}
  .method .mbody b{color:var(--text)}

  /* ---------- misc ---------- */
  .note{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px}
  .note h3{font-size:16px; font-weight:700}
  .note p{margin:0; color:var(--text-2); font-size:14px}
  .note a{color:var(--blue)}
  .empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:14px}
  footer{padding:18px 2px 4px; color:var(--muted); font-size:12px; text-align:center; line-height:1.6}
  footer a{color:var(--muted)}
  .seasonmenu{position:fixed; inset:0; z-index:80; background:rgba(10,16,28,.5); display:flex; align-items:flex-end; justify-content:center}
  .seasonmenu[hidden]{display:none}
  .seasonmenu .panel{background:var(--surface); width:100%; max-width:760px; border-radius:16px 16px 0 0; max-height:74vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom, 0px)}
  .seasonmenu .ph{padding:14px 16px 10px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between}
  .seasonmenu .ph h3{font-size:15px; font-weight:700}
  .seasonmenu .list{overflow-y:auto; display:flex; flex-direction:column}
  .seasonmenu .list button{padding:12px 16px; text-align:left; border-top:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:15px}
  .seasonmenu .list button[aria-pressed="true"]{color:var(--orange); font-weight:600}
  .seasonmenu .list .tag{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-family:"Archivo",sans-serif; font-weight:700}

  /* ---------- bottom nav ---------- */
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px)}
  .nav-inner{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr)}
  @media (max-width:430px){
    .nav button{font-size:8.5px; letter-spacing:.02em}
    .nav button svg{width:19px; height:19px}
  }
  .nav button{height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-family:"Archivo",sans-serif; font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase}
  .nav button svg{width:20px; height:20px}
  .nav button[aria-pressed="true"]{color:var(--orange)}
</style>

  /* ---------- routing ----------

      if(parts[1] && /^\d{4}$/.test(parts[1])) plan.season = parts[1];
      return plan;
    }
    return plan;
  }
  function saveFavs(){
    try{ localStorage.setItem("psal.favs", JSON.stringify(Array.from(S.favs))); }catch(e){}
    syncFavUrl();
  }
  function toggleFav(key){
    if(S.favs.has(key)) S.favs.delete(key); else S.favs.add(key);
    saveFavs(); render();
    if(S.openTeamKey) openTeam(S.openTeamKey);
  }
  function isFavGame(g){
    return S.favs.has(g[0] + ":" + g[4]) || S.favs.has(g[0] + ":" + g[5]);
  }

  /* ---------- game row ---------- */
  function sideHTML(g, home){
    var code = home ? g[4] : g[5], t = teamOf(g[0], code);
    var st = status(g), r = hasScore(g) ? resultFor(g, code) : null;
    var cls = "side";
    if(r && !r.ff){ cls += r.wl === "W" ? " win" : (r.wl === "L" ? " lose" : ""); }
    var sc = "";
    if(hasScore(g)){
      if(g[6] === 999 || g[7] === 999) sc = (r && r.wl === "W") ? "W" : "L";
      else sc = home ? g[6] : g[7];
    }
    var scCls = "sc" + (r && r.wl === "W" ? " win" : "");
    return '<div class="' + cls + '"><span class="ha">' + (home ? "H" : "A") + '</span>' +
           '<span class="nm">' + esc(t.short) + '</span></div>' +
           '<div class="' + scCls + '">' + (sc === "" ? "" : esc(sc)) + '</div>';
  }
  function gameHTML(g, opts){
    opts = opts || {};
    var st = status(g), chips = [];
    if(st === "final") chips.push('<span class="chip final">Final</span>');
    else if(st === "ppd") chips.push('<span class="chip ppd">Postponed</span>');
    else if(st === "ff") chips.push('<span class="chip ff">Forfeit</span>');
    else if(st === "sus") chips.push('<span class="chip ppd">Suspended</span>');
    else if(g[3]) chips.push('<span class="chip time">' + esc(fmtTime(g[3])) + '</span>');
    if(g[10] === 1){
      var rl = roundLabel(g), cls = bracketLabel(g);
      chips.push('<span class="chip po">' + esc(((cls ? cls + " " : "") + rl).trim() || "Playoffs") + '</span>');
    } else if(g[10] === 2){
      chips.push('<span class="chip cls">Non-league</span>');
    }
    if(isFavGame(g)) chips.push('<span class="chip fav">Following</span>');
    if(opts.date) chips.push('<span class="chip time">' + esc(fmtDate(g[2])) + '</span>');
    var meta = chips.join("");
    var venue = locOf(g);
    if(venue && !opts.noVenue) meta += '<span class="venue">' + esc(venue) + '</span>';
    return '<button class="game' + (isFavGame(g) ? " pin" : "") + '" data-game="' + esc(gkey(g)) + '">' +
      sideHTML(g, true) + sideHTML(g, false) +
      '<div class="gmeta">' + meta + '</div></button>';
  }

  /* ---------- view: scores ---------- */
  function renderScores(){
    var v = el("view-scores"), ps = S.season;
    var all = ps.raw.G.filter(function(g){ return g[0] === S.sp; });
    var boros = {}, divs = {};
    all.forEach(function(g){
      var t = teamOf(g[0], g[4]);
      if(t.boro) boros[t.boro] = 1;
      if(t.div) divs[t.div] = 1;
    });
    var dayGames = (ps.byDate[S.date] || []).filter(function(g){ return g[0] === S.sp; });
    var shown = dayGames.filter(function(g){
      if(S.boro){
        var th = teamOf(g[0], g[4]), ta = teamOf(g[0], g[5]);
        if(th.boro !== S.boro && ta.boro !== S.boro) return false;
      }
      if(S.div){
        var th2 = teamOf(g[0], g[4]), ta2 = teamOf(g[0], g[5]);
        if(th2.div !== S.div && ta2.div !== S.div) return false;
      }
      return true;
    });
    var favGames = shown.filter(isFavGame);

    var boroList = BOROS.filter(function(b){ return boros[b]; });

    html += '<div class="filters">' +

        }).join("") + '</div></div>' +
      '<div class="filterrow"><span class="flabel">Division</span><div class="chips scroll">' +
        '<button data-div="" aria-pressed="' + (S.div === "") + '">All</button>' +

      '</div>';

    html += '<div class="sectionhead"><span class="eyebrow">' + esc(S.date ? fmtDateLong(S.date) : "Schedule") + '</span>' +
      '<span class="eyebrow">' + shown.length + ' of ' + dayGames.length + ' games</span></div>';

    if(favGames.length){
      html += '<div class="group"><div class="grouphead"><h3>Following</h3><div class="rule"></div></div>' +
        '<div class="card"><div class="games">' + sortGames(favGames).map(function(g){ return gameHTML(g); }).join("") + '</div></div></div>';
    }

      html += '<div class="card"><div class="games">' + sortGames(rest).map(function(g){ return gameHTML(g); }).join("") + '</div></div>';

  /* ---------- view: teams ---------- */
  function renderTeams(){

  /* ---------- view: playoffs ---------- */
  function renderPlayoffs(){
    var v = el("view-playoffs"), ps = S.season;
    var po = ps.raw.G.filter(function(g){ return g[0] === S.sp && g[10] === 1; });
    if(!po.length){
      v.innerHTML = '<div class="note"><h3>No playoff games yet</h3>' +
        '<p>Playoff brackets appear here once PSAL posts postseason games for ' + esc(ps.label) + '.</p></div>';
      return;
    }
    var byCls = {}, brTier = {};
    po.forEach(function(g){
      var bi = (g.length > 12) ? g[12] : -1;
      var br = bracketOf(g);
      var key = bi >= 0 ? ((br && br[0] ? br[0] : "Playoffs") + "#" + bi) : "Other playoff games";
      if(brTier[key] == null) brTier[key] = (bi >= 0 && br) ? br[1] : 9;
      (byCls[key] = byCls[key] || []).push(g);
    });
    var order = Object.keys(byCls).sort(function(a, b){
      return (brTier[a] - brTier[b]) || a.localeCompare(b);
    });

        '<span class="eyebrow">' + po.length + ' games</span></div>' +
      order.map(function(c){
        var gs = byCls[c].slice().sort(function(a, b){ return (a[2] - b[2]) || (a[11] - b[11]); });
        var byRound = {};
        gs.forEach(function(g){ (byRound[g[11]] = byRound[g[11]] || []).push(g); });
        var keys = Object.keys(byRound).map(Number).sort(function(a, b){ return a - b; });
        var label = c.split("#")[0];
        return '<div class="group"><div class="grouphead"><h3>' + esc(label) + '</h3><div class="rule"></div></div>' +
          keys.map(function(ri){
            var label = ri >= 0 && ri < ROUNDS.length ? ROUNDS[ri] : "Playoffs";
            return '<div class="sectionhead" style="padding:8px 2px 4px"><span class="eyebrow">' + esc(label) + '</span>' +
              '<span class="eyebrow">' + esc(fmtDate(byRound[ri][0][2])) + '</span></div>' +
              '<div class="card"><div class="games">' +
              sortGames(byRound[ri]).map(function(g){ return gameHTML(g, {noVenue:ri === 5 ? false : true}); }).join("") +
              '</div></div>';

  /* ---------- view: history (champions + rankings) ---------- */

  function champsHTML(){
    var F = S.hist.finals || {};
    var years = META.seasons.map(function(m){ return m.id; })
      .filter(function(y){ return F[y]; })

        return '<div class="final">' +

          '<div class="pair">' +
            '<button class="side win" data-hteam="' + esc(S.sp + ":" + w) + '">' +
              '<span class="medal gold"></span><span class="nm' + (S.favs.has(S.sp + ":" + w) ? " pin" : "") + '">' + esc(wn) + '</span>' +
              '<span class="sc">' + ws + '</span></button>' +
            '<button class="side" data-hteam="' + esc(S.sp + ":" + l) + '">' +
              '<span class="medal silver"></span><span class="nm' + (S.favs.has(S.sp + ":" + l) ? " pin" : "") + '">' + esc(ln) + '</span>' +
              '<span class="sc">' + ls + '</span></button>' +
          '</div>' +
          '<div class="when">' + esc(fmtDate(d)) + '</div>' +
        '</div>';
      }).join("") + '</div></div>';
    }).join("");
    out += '<div style="font-size:12px;color:var(--muted);padding:6px 2px 0">Levels are shown as PSAL named them that season: ' +
      'the top flight was <b>1A</b> (with B, and later D, beneath it) through 2024, and became <b>3A</b> from 2025. ' +
      'A few seasons ran two separate brackets at the same level; the earlier one is tagged <b>2nd</b>.</div>';
    return out;
  }
  function rankRows(){
    var T = S.hist.teams, out = [];
    Object.keys(T).forEach(function(k){
      var sp = +k.split(":")[0];
      if(sp !== S.sp) return;
      var e = T[k], w = 0, l = 0, t = 0, n = 0, titles = 0, finals = 0, rsum = 0, gsum = 0, cls = {};
      e.s.forEach(function(r){
        if(S.rankYear !== "all" && r[0] !== +S.rankYear) return;
        var g = r[1] + r[2] + r[3];
        if(!g) return;
        /* The W-L-T shown is every game: PSAL's league table plus the playoff
           run, which is tracked separately in the archive. Without the playoff
           half a dynasty looks as though it never lost. The rating is unaffected
           -- it reads league points and playoff round as separate terms. */
        w += r[1] + (r[9] || 0); l += r[2] + (r[10] || 0); t += r[3] + (r[11] || 0); n++;
        gsum += g; rsum += seasonRating(r) * g;
        if(r[5]) cls[r[5]] = (cls[r[5]] || 0) + 1;
        if((r[7] || 0) === 6) titles++;
        if((r[7] || 0) >= 5) finals++;
      });
      if(!gsum) return;
      var topCls = Object.keys(cls).sort(function(a, b){ return cls[b] - cls[a]; })[0] || "";
      out.push({key:k, name:(e.sn || e.n), w:w, l:l, t:t, n:n, cls:topCls,
                p:pct(w, l, t), r:rsum / gsum, titles:titles, finals:finals});
    });
    var maxG = 0;
    out.forEach(function(r){ maxG = Math.max(maxG, r.w + r.l + r.t); });
    var min = S.rankYear === "all" ? 40 : Math.max(1, Math.min(6, Math.floor(maxG / 2)));
    out = out.filter(function(r){ return (r.w + r.l + r.t) >= min; });
    var key = S.rankSort || "r";
    out.sort(function(a, b){
      if(key === "titles") return (b.titles - a.titles) || (b.finals - a.finals) || (b.r - a.r);
      if(key === "p") return (b.p - a.p) || (b.w - a.w);
      return (b.r - a.r) || (b.p - a.p);
    });
    return out;
  }
  function rankHTML(){
    var years = META.seasons.map(function(m){ return m.id; }).sort(function(a, b){ return b - a; });
    var chips = '<div class="filterrow"><span class="flabel">Season</span><div class="chips scroll">' +

      years.map(function(y){
        return '<button data-ry="' + y + '" aria-pressed="' + (S.rankYear === y) + '">' + esc((seasonMeta(y).label || y).replace("Fall ", "")) + '</button>';
      }).join("") + '</div></div>';
    var sortKey = S.rankSort || "r";
    chips += '<div class="filterrow"><span class="flabel">Rank by</span><div class="chips">' +
      [["r","Rating"],["p","Win %"],["titles","Titles"]].map(function(o){
        return '<button data-rs="' + o[0] + '" aria-pressed="' + (sortKey === o[0]) + '">' + o[1] + '</button>';
      }).join("") + '</div></div>';
    var rows = rankRows();
    var body = rows.length ? '<div class="card"><div class="standtbl"><table><thead><tr>' +
      '<th>School</th>' + (S.rankYear === "all" ? '' : '<th class="lv">Lvl</th>') + '<th class="rec">W-L-T</th><th class="w">' + (sortKey === "p" ? "Win%" : "Rating") + '</th>' +
      (S.rankYear === "all" ? '<th>Yrs</th>' : '') + '<th>Ttl</th></tr></thead><tbody>' +
      rows.slice(0, 150).map(function(r, i){
        var pin = S.favs.has(r.key);
        return '<tr class="' + (pin || S.favs.has(r.key) ? "isfav" : "") + '"><td><button class="tm" data-hteam="' + esc(r.key) + '">' +
          '<span class="pos">' + (i+1) + '</span><span>' + esc(r.name) + '</span></button></td>' +
          (S.rankYear === "all" ? '' : '<td class="lv">' + esc(r.cls) + '</td>') + '<td class="rec">' + r.w + '-' + r.l + '-' + r.t + '</td>' +
          '<td class="pts w">' + pct3(sortKey === "p" ? r.p : r.r) + '</td>' +
          (S.rankYear === "all" ? '<td>' + r.n + '</td>' : '') +
          '<td>' + (r.titles || "") + '</td></tr>';
      }).join("") + '</tbody></table></div></div>' +
      methodHTML() :
      '<div class="card"><div class="empty">Not enough games on record for this season.</div></div>';
    return '<div class="filters">' + chips + '</div>' +
      '<div class="sectionhead"><span class="eyebrow">' + (S.rankYear === "all" ? "All-time ranking" : esc(seasonMeta(S.rankYear).label || S.rankYear)) + '</span>' +
      '<span class="eyebrow">' + (sortKey === "titles" ? "by titles" : (sortKey === "p" ? "by win percentage" : "by rating")) + '</span></div>' + body;
  }

  /* ---------- history chart ---------- */
  function methodHTML(){
    var inprog = S.rankYear !== "all" && seasonMeta(S.rankYear).cur;
    return '<details class="method"' + (S.methodOpen ? " open" : "") + ' id="method">' +
      '<summary>How the rating is calculated</summary>' +
      '<div class="mbody">' +
      '<p><b>Season rating</b> = level weight &times; (0.75 &times; league points% + 0.25 &times; playoff score). ' +
      'It runs 0 to 1, so .800 is a strong season in the top flight and a perfect record two tiers down lands near .760.</p>' +
      '<p><b>League points%</b> is PSAL\'s own table: 3 points for a win, 1 for a tie, divided by 3 &times; games played. Only league games count \u2014 playoff results enter through the next term.</p>' +
      '<p><b>Playoff score</b>: missed the playoffs 0 \u00b7 qualified .20 \u00b7 round of 16 .30 \u00b7 quarterfinals .45 \u00b7 semifinals .60 \u00b7 lost the final .80 \u00b7 <b>won the title 1.00</b>.</p>' +
      '<p><b>Level weight</b>: top flight &times;1.00, second tier &times;0.88, third &times;0.76, anything below &times;0.68. PSAL renamed its ladder in 2025 \u2014 1A was the <i>top</i> division through 2024 and is the <i>bottom</i> one now \u2014 so the app reads each season\'s own ladder rather than the label. That is also why the all-time table leaves the level column out.</p>' +
      '<p><b>All-time</b> is the average of a school\'s season ratings, weighted by games played, across every season in the archive. Titles counts championships won.</p>' +
      '<p><b>Who appears</b>: 40 games minimum all-time; for a single season, half the leader\'s games played, capped at six.</p>' +
      '<p><b>Forfeits</b> count exactly as PSAL records them \u2014 a forfeit win is a win.' +
      (inprog ? ' This season is still in progress, and PSAL books forfeited fixtures as losses in advance, so a school that withdrew shows a full slate of losses on day one.' : '') + '</p>' +
      '<p><b>Win %</b> = (wins + half of ties) &divide; games played. It ignores level and playoffs entirely \u2014 useful as a sanity check against the rating.</p>' +
      '<p><b>W-L-T</b> is every game on record \u2014 league fixtures <i>and</i> playoff games \u2014 with ties included. PSAL\'s own standings count league play only, so a school that goes deep every year looks almost unbeaten until the playoff games are added back in. Win % uses the same full record, counting a tie as half a win.</p>' +
      '</div></details>';
  }

  /* ---------- citywide leaders ---------- */
  var LB_STATS = [["g","Goals","G"],["a","Assists","A"],["p","Points","Pts"],["sh","Shots","Sh"],["sv","Saves","Sv"]];
  function seasonAgg(sp){
    var key = S.seasonId + ":" + sp;
    if(S.aggCache[key]) return S.aggCache[key];
    var ps = S.season, P = ps.raw.P, map = {}, list = [];
    ps.raw.G.forEach(function(g){
      if(g[0] !== sp) return;
      var d = ps.raw.X[gkey(g)];
      if(!d || !d[4] || !d[4].length) return;
      d[4].forEach(function(r){
        var nm = P[r[1]] || "";
        if(!nm) return;
        var k = r[0] + "|" + nm, e = map[k];
        if(!e){ e = map[k] = {n:nm, code:r[0], gp:0, g:0, a:0, sv:0, ga:0, sh:0}; list.push(e); }
        e.gp++; e.g += r[2]; e.a += r[3]; e.sv += r[4]; e.sh += r[5]; e.ga += r[6];
      });
    });
    list.forEach(function(e){ e.p = e.g + e.a; });
    S.aggCache[key] = list;
    return list;
  }
  function leadersHTML(){
    if(!S.season || S.season === "error"){

          esc((seasonMeta(y).label || y).replace("Fall ", "")) + '</button>';
      }).join("") + '</div></div>';
    /* levels present this season, ordered by tier */
    var tiers = {};
    Object.keys(ps.teams).forEach(function(k){
      var t = ps.teams[k];
      if(t.sp === S.sp && t.cls) tiers[t.cls] = tierOf(t.div);
    });
    var levels = Object.keys(tiers).sort(function(a, b){ return tiers[a] - tiers[b]; });
    chips += '<div class="filterrow"><span class="flabel">Level</span><div class="chips scroll">' +

    var stat = S.lbStat, rows = seasonAgg(S.sp).filter(function(e){

        return '<tr class="' + (pin ? "isfav" : "") + '"><td><span class="tm" style="display:flex;gap:8px;align-items:baseline">' +
          '<span class="pos">' + (i+1) + '</span><span>' + plink(S.sp, r.code, r.n) +
          '<br><button data-team="' + esc(S.sp + ":" + r.code) + '" style="font-size:11.5px;color:var(--muted);text-align:left">' +
          esc(t ? t.short : r.code) + (t && t.cls ? " \u00b7 " + esc(t.cls) : "") + '</button></span>' +
          '</span></td>' +
          '<td>' + r.gp + '</td><td class="pts w">' + r[stat] + '</td></tr>';
      }).join("") + '</tbody></table></div></div>' :
      '<div class="card"><div class="empty">No ' + esc(label.toLowerCase()) + ' recorded yet this season.</div></div>';
    return '<div class="filters">' + chips + '</div>' +
      '<div class="sectionhead"><span class="eyebrow">' + esc(ps.label) + ' \u00b7 ' + esc(label) + '</span>' +
      '<span class="eyebrow">' + (S.lbTier === "all" ? "all levels" : esc(S.lbTier)) + '</span></div>' + body +
      '<div style="font-size:12px;color:var(--muted);padding:6px 2px 0">Totals come from the box scores coaches file with PSAL, so a school that never files stats shows no players here. GP counts games with a stat line, not appearances.</div>';
  }

  function chartHTML(key){
    var e = S.hist && S.hist.teams[key];
    if(!e || !e.s.length) return "";
    var pts = e.s.slice().sort(function(a, b){ return a[0] - b[0]; }).map(function(r){
      return {y:+r[0], label:(seasonMeta(String(r[0])).label || r[0]), w:r[1], l:r[2], t:r[3],
              cls:r[5] || "", res:(r[7] || 0), p:pct(r[1], r[2], r[3]), v:seasonRating(r),
              live:!!seasonMeta(String(r[0])).cur};
    }).filter(function(p){ return (p.w + p.l + p.t) > 0; });
    if(!pts.length) return "";
    window.__chartPts = pts;
    var n = pts.length;
    var titles = pts.filter(function(p){ return p.res === 6; }).length;
    var best = pts.slice().sort(function(a, b){ return b.v - a.v; })[0];
    return '<div class="chartcard"><div class="head"><h3>Season by season</h3>' +
      '<span class="legend">' + n + ' season' + (n === 1 ? "" : "s") +
      (titles ? " \u00b7 " + titles + " title" + (titles === 1 ? "" : "s") : "") + '</span></div>' +
      '<div class="chartbox" id="chartbox"></div>' +
      '<div class="chartnote" id="chartnote">' + esc(noteFor(pts[n-1].live ? pts[n-1] : best)) + '</div></div>';
  }
  function drawChart(){
    var box = el("chartbox"), pts = window.__chartPts;
    if(!box || !pts || !pts.length) return;
    var W = Math.max(240, Math.round(box.clientWidth || 340)), H = 104;
    var PADL = 24, PADR = 8, PADT = 9, PADB = 17;
    var n = pts.length, iw = W - PADL - PADR, ih = H - PADT - PADB;
    function X(i){ return n === 1 ? PADL + iw/2 : PADL + iw * i/(n-1); }
    function Y(v){ return PADT + ih * (1 - v); }
    var liveIdx = -1;
    pts.forEach(function(p, i){ if(p.live) liveIdx = i; });
    var solidTo = (liveIdx === n - 1 && n > 1) ? n - 2 : n - 1;
    var line = pts.slice(0, solidTo + 1).map(function(p, i){
      return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1);
    }).join(" ");
    var tail = (solidTo < n - 1) ?
      '<path class="ln live" d="M' + X(n-2).toFixed(1) + " " + Y(pts[n-2].v).toFixed(1) +
      "L" + X(n-1).toFixed(1) + " " + Y(pts[n-1].v).toFixed(1) + '"></path>' : "";
    var grid = [0, 0.5, 1].map(function(g){
      return '<line class="grid" x1="' + PADL + '" x2="' + (W-PADR) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '"></line>' +
        '<text class="axis" x="0" y="' + (Y(g)+3.5).toFixed(1) + '">' + (g === 1 ? "1.0" : (g === 0 ? "0" : ".5")) + '</text>';
    }).join("");
    var want = Math.max(2, Math.min(W < 330 ? 3 : 5, n)), idxs = [];
    for(var k = 0; k < want; k++){
      var ix = n === 1 ? 0 : Math.round(k * (n - 1) / (want - 1));
      if(idxs.indexOf(ix) === -1) idxs.push(ix);
    }
    var ticks = idxs.map(function(ix){
      var anchor = ix === 0 ? "start" : (ix === n - 1 ? "end" : "middle");
      return '<text class="axis" text-anchor="' + anchor + '" x="' + X(ix).toFixed(1) + '" y="' + (H - 3) + '">' + (pts[ix].y - 1) + '</text>';
    }).join("");
    var dots = pts.map(function(p, i){
      var gold = p.res === 6, silver = p.res === 5;
      var style = gold ? ' style="fill:#E3B341;stroke:#A87C15;stroke-width:1.6"' :
                  (silver ? ' style="fill:#C3CBD6;stroke:#8A96A6;stroke-width:1.6"' : '');
      if(p.live) style = ' style="fill:var(--bg);stroke:var(--orange);stroke-width:1.6;stroke-dasharray:2.6 2"';
      return '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (p.live ? 4.4 : ((gold || silver) ? 4.6 : 2.9)) + '"' +
        style + '></circle>' +
        '<circle class="hit" data-pt="' + i + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="11"></circle>';
    }).join("");
    box.innerHTML = '<svg class="chart" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" id="teamchart">' +
      grid + ticks + '<path class="ln" d="' + line + '"></path>' + tail + dots + '</svg>';
  }
  function noteFor(p){
    return [p.label, p.cls, p.w + "-" + p.l + (p.t ? "-" + p.t : ""),
            (PO_LABEL[p.res] || ""), "rating " + pct3(p.v),

      .filter(Boolean).join(" · ");

  function teamSegHTML(key){

  function teamYearsHTML(key){
    var parts = key.split(":"), sp = +parts[0], code = parts[1];

    if(e) e.s.forEach(function(r){ ids[String(r[0])] = 1; });

      list.map(function(id){

          esc((seasonMeta(id).label || id).replace("Fall ", "")) + '</button>';

  function playerStats(sp, code){
    var ps = S.season, P = ps.raw.P, agg = {}, order = [];
    ps.raw.G.forEach(function(g){
      if(g[0] !== sp || (g[4] !== code && g[5] !== code)) return;
      var d = detailOf(g);
      if(!d || !d[4] || !d[4].length) return;
      d[4].forEach(function(r){
        if(r[0] !== code) return;
        var nm = P[r[1]] || "";
        if(!nm) return;
        var e = agg[nm];
        if(!e){ e = agg[nm] = {n:nm, gp:0, g:0, a:0, sv:0, ga:0, sh:0}; order.push(e); }
        e.gp++; e.g += r[2]; e.a += r[3]; e.sv += r[4]; e.sh += r[5]; e.ga += r[6];
      });
    });
    return order;
  }
  function statsHTML(sp, code){
    var rows = playerStats(sp, code);
    if(!rows.length) return "";
    var field = rows.filter(function(r){ return r.g || r.a || r.sh; })
      .sort(function(x, y){ return (y.g - x.g) || (y.a - x.a) || (y.sh - x.sh) || x.n.localeCompare(y.n); });
    var keepers = rows.filter(function(r){ return r.sv || r.ga; })
      .sort(function(x, y){ return (y.sv - x.sv) || (x.ga - y.ga); });
    if(!field.length && !keepers.length) return "";
    var goals = field.reduce(function(a, r){ return a + r.g; }, 0);

        '<div class="plist">' + top.map(function(r){

          return '<div class="prow"><span class="pn">' + numSlot(code, r.n) +

        '<div class="card"><div class="standtbl"><table><thead><tr>' +
        '<th>Player</th><th>GP</th><th>Sv</th><th>GA</th></tr></thead><tbody>' +
        keepers.map(function(r){

            '<td>' + r.gp + '</td><td class="pts">' + (r.sv || "") + '</td><td>' + (r.ga || "") + '</td></tr>';
        }).join("") + '</tbody></table></div></div>';

  /* ---------- team sheet ---------- */
  function openTeam(key){
    var parts = key.split(":"), sp = +parts[0], code = parts[1];
    S.openTeamKey = key;
    var t = teamOf(sp, code), ps = S.season;
    el("sheet-name").textContent = t.name;
    el("sheet-sub").textContent = [divLabel(t.div), ps.label].filter(Boolean).join(" · ");
    var fav = el("sheet-fav");
    fav.setAttribute("aria-pressed", S.favs.has(key) ? "true" : "false");
    fav.dataset.key = key;
    fav.querySelector("svg").setAttribute("fill", S.favs.has(key) ? "currentColor" : "none");

    var games = ps.raw.G.filter(function(g){ return g[0] === sp && (g[4] === code || g[5] === code); })
      .sort(function(a, b){ return a[2] - b[2]; });
    var today = todayInt();
    var played = games.filter(function(g){ return hasScore(g) || g[2] < today; });
    var upcoming = games.filter(function(g){ return !hasScore(g) && g[2] >= today; });
    var w = 0, l = 0, tie = 0, gf = 0, ga = 0;
    played.forEach(function(g){
      var r = resultFor(g, code);
      if(!r) return;
      if(r.wl === "W") w++; else if(r.wl === "L") l++; else tie++;
      if(!r.ff){ gf += r.gf; ga += r.ga; }
    });
    var rec = ps.rec[key];
    var html = teamSegHTML(key) + teamYearsHTML(key);
    html += S.histState === "ok" ? chartHTML(key) :
      '<div class="chartcard"><div class="head"><h3>Season by season</h3></div>' +
      '<div class="' + (S.histState === "error" ? "empty" : "loading") + '" style="padding:32px 8px">' +
      (S.histState === "error" ? "History unavailable." : "Loading history…") + '</div></div>';
    html += '<div class="statrow">' +
      '<div class="stat"><div class="k">Record</div><div class="v">' + (rec ? rec[1] + "-" + rec[2] + (rec[3] ? "-" + rec[3] : "") : w + "-" + l + (tie ? "-" + tie : "")) + '</div></div>' +
      '<div class="stat"><div class="k">Goals for</div><div class="v">' + gf + '</div></div>' +
      '<div class="stat"><div class="k">Goals against</div><div class="v">' + ga + '</div></div></div>';
    if(played.length){
      var withScore = played.filter(hasScore);
      var withStats = withScore.filter(function(g){ return boxRowsFor(g, code) > 0; });
      var cover = withScore.length ?
        '<span class="eyebrow" style="color:' + (withStats.length === withScore.length ? "var(--muted)" : "var(--orange)") + '">stats ' +

      html += '<div><div class="grouphead"><h3>Results</h3><div class="rule"></div>' + cover + '</div><div class="card">' +

        html += '<div style="font-size:12.5px;color:var(--muted);padding:0 2px">' +
          (withScore.length - withStats.length) + ' of ' + withScore.length +
          ' games have no player stats filed for this school on PSAL.</div>';

    html += statsHTML(sp, code);
    if(upcoming.length){
      html += '<div><div class="grouphead"><h3>Upcoming</h3><div class="rule"></div></div>' +
        '<div class="card"><div class="games">' + upcoming.map(function(g){ return gameHTML(g, {date:true}); }).join("") + '</div></div></div>';
    }
    if(!played.length && !upcoming.length) html += '<div class="card"><div class="empty">No games on the schedule.</div></div>';
    el("sheet-body").innerHTML = html;
    paintTeamNumbers(S.seasonId, sp, code);

  }
  function resLine(g, code){
    var r = resultFor(g, code);
    var opp = teamOf(g[0], g[4] === code ? g[5] : g[4]);
    var home = g[4] === code;
    var right = r ? (r.ff ? r.gf : (r.gf + "–" + r.ga)) : "<span style='color:var(--muted);font-weight:600;font-size:12px'>No score posted</span>";
    var sub = fmtDate(g[2]) + " · " + (home ? "Home" : "Away") + (locOf(g) ? " · " + locOf(g) : "");
    if(hasScore(g) && !boxRowsFor(g, code)) sub = fmtDate(g[2]) + " · " + (home ? "Home" : "Away") + " · no stats filed";
    if(g[10] === 1) sub = fmtDate(g[2]) + " · " + ((bracketLabel(g) ? bracketLabel(g) + " " : "") + roundLabel(g)).trim();
    return '<button class="resline' + (S.favs.has(opp.sp + ":" + opp.code) ? " pin" : "") + '" data-game="' + esc(gkey(g)) + '">' +
      '<span class="wl ' + (r ? r.wl : "") + '">' + (r ? r.wl : "·") + '</span>' +
      '<span class="op"><span class="nm">' + esc(opp.short) + '</span><span class="dt">' + esc(sub) + '</span></span>' +
      '<span class="rs">' + right + '</span></button>';
  }
  function closeSheet(){
